<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eleven | GTM operating model</title>
<style>
:root{
  --bg:#F7F5F0;--surface:#FFFFFF;--aside:#EFEDE7;--ink:#1B2430;--muted:#5B6675;--navy:#0F3D6B;--blue:#185FA5;--light:#9EC3E8;
  --row:#EAF1F8;--line:#D9DEE5;--amber-bg:#FFF4DC;--amber:#7A4F00;--amber-line:#D9A23A;
  --green-bg:#E3F2E8;--green:#1F6B3A;--greenl:#3E9B62;--red:#B23B3B;--head-muted:#B9CDE2;--chip:#174B80;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0E1620;--surface:#15212E;--aside:#111C27;--ink:#E6ECF2;--muted:#9AA8B8;--navy:#0B2A4A;--blue:#74AEE6;--light:#4E7FB0;
  --row:#1A2A3B;--line:#2A3B4E;--amber-bg:#3A2C10;--amber:#F3CB78;--amber-line:#B5862C;
  --green-bg:#133222;--green:#86D6A2;--greenl:#5FBF85;--red:#F08A8A;--head-muted:#9FB6CE;--chip:#123A63;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0E1620;--surface:#15212E;--aside:#111C27;--ink:#E6ECF2;--muted:#9AA8B8;--navy:#0B2A4A;--blue:#74AEE6;--light:#4E7FB0;
  --row:#1A2A3B;--line:#2A3B4E;--amber-bg:#3A2C10;--amber:#F3CB78;--amber-line:#B5862C;
  --green-bg:#133222;--green:#86D6A2;--greenl:#5FBF85;--red:#F08A8A;--head-muted:#9FB6CE;--chip:#123A63;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Arial,Helvetica,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
header.top{background:var(--navy);color:#fff;padding:18px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
header h1{font-size:19px;margin:0;font-weight:700}
header .sub{font-size:13px;color:var(--head-muted);margin:2px 0 0}
.presets{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.presets button{font:13px Arial,sans-serif;padding:7px 14px;border-radius:16px;border:1px solid #3A6290;background:transparent;color:#fff;cursor:pointer}
.presets button.active{background:#185FA5;border-color:#185FA5}
.save{font-size:12.5px;color:var(--head-muted)}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:calc(100vh - 70px)}
aside{background:var(--aside);border-right:1px solid var(--line);padding:20px 20px 40px}
aside h2{font-size:13px;font-weight:700;color:var(--blue);margin:24px 0 10px}
aside h2:first-child{margin-top:0}
.ctl{margin-bottom:13px}
.ctl .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:3px}
.ctl label{font-size:13px}
output{font-size:13px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap}
.hint{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
input[type=range]{width:100%;accent-color:var(--blue)}
input:not([type=range]):not([type=checkbox]),select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:5px 7px;min-width:0;width:100%}
input[type=checkbox]{accent-color:var(--blue)}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{display:grid;grid-template-columns:1fr 64px 64px;gap:6px;align-items:center;font-size:12.5px}
.mini.h{color:var(--muted);font-size:11.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.derived{font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;line-height:1.55}
button{font:inherit;font-size:13.5px;cursor:pointer;border-radius:4px;padding:7px 12px;border:1px solid var(--blue);background:var(--blue);color:#fff}
button.ghost{background:transparent;color:var(--blue)}
button.x{background:transparent;border:none;color:var(--muted);padding:2px 6px;font-size:17px;line-height:1}
button.link{background:none;border:none;color:var(--blue);padding:0;font-size:13px;text-decoration:underline}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
main{padding:22px 26px 60px;min-width:0}
.headline{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.headline .big{font-size:44px;font-weight:700;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .headline .big{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .headline .big{color:var(--ink)}}
.headline .big.alt{color:var(--blue)}
.headline .vs{color:var(--muted);font-size:15px}
.hl-label{color:var(--muted);font-size:13.5px;margin:2px 0 16px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted);line-height:1.35}
.rail{list-style:none;margin:0 0 20px;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.rail li{position:relative;padding:14px 12px 0 0}
.rail li::before{content:"";position:absolute;left:0;right:0;top:4px;height:3px;background:var(--line)}
.rail li.on::before{background:var(--blue)}
.rail li::after{content:"";position:absolute;left:0;top:0;width:11px;height:11px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.rail li.on::after{border-color:var(--blue);background:var(--blue)}
.rail li.met::after{border-color:var(--greenl);background:var(--greenl)}
.rail b{display:block;font-size:14px}
.rail span{font-size:12.5px;color:var(--muted);display:block}
.chartblock{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:16px}
.chartblock h3{margin:0 0 2px;font-size:15.5px}
.chartblock p{margin:0 0 8px;color:var(--muted);font-size:13px;max-width:80ch}
svg.chart{width:100%;height:auto;display:block}
svg .grid line{stroke:var(--line)}
svg text{fill:var(--muted);font:11px Arial,Helvetica,sans-serif}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:26px 0 18px}
nav.tabs a{padding:10px 12px;color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:3px solid transparent;font-size:14px}
nav.tabs a[aria-current="page"]{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
h2.sec{font-size:18px;margin:0 0 4px}
p.lead{margin:0 0 16px;color:var(--muted);max-width:75ch;font-size:13.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:16px}
.panel h3{font-size:15px;margin:0 0 8px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:700;color:var(--muted);font-size:12px;padding:7px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even) td{background:var(--row)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td input.name{min-width:190px}
.callout{border-left:4px solid var(--amber-line);background:var(--amber-bg);color:var(--amber);padding:9px 13px;border-radius:4px;margin-bottom:14px;font-size:13.5px}
.callout.ok{border-left-color:var(--green);background:var(--green-bg);color:var(--green)}
.gates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.gate{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.gate.met{border-top-color:var(--greenl)}
.gate .crit{display:flex;gap:6px;align-items:center}
.gate ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
.sm{font-size:12.5px;color:var(--muted)}
.gap{color:var(--red);font-weight:700}
.okv{color:var(--green);font-weight:700}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.plan td:first-child,.plan th:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:210px}
.plan tbody tr:nth-child(even) td:first-child{background:var(--row)}
.plan tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.track input{width:90px;text-align:right}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:min(720px,92vw);width:100%}
dialog textarea{width:100%;height:260px;font:12px/1.4 Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line)}
.foot{font-size:12px;color:var(--muted);margin-top:24px;max-width:90ch;line-height:1.55}
@media (max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.gates{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.layout{grid-template-columns:1fr}aside{border-right:none;border-bottom:1px solid var(--line)}main{padding:18px 16px 50px}.rail{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.gates{grid-template-columns:1fr}.headline .big{font-size:34px}header.top{padding:14px 16px}}


.capgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin:12px 0}
.capcol{border:1px solid var(--line);border-radius:6px;padding:10px 14px 4px;background:var(--surface)}
.capcol h4{margin:0 0 4px;font-size:14px;color:var(--blue)}
.caprow{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.caprow input:not([type=checkbox]){text-align:right;width:100%;min-width:0;max-width:100%;box-sizing:border-box}
.capin input:not([type=checkbox]){width:70px}
.capv{text-align:right;padding-right:8px}
.capin{display:flex;align-items:center;gap:4px}
.capcol .hint{margin:6px 0 8px}
.statgrid label{min-width:0}.statgrid input{width:100%;min-width:0}
details.chartblock summary{cursor:pointer;font-size:15.5px;list-style-position:inside}
</style>
</head>
<body>
<header class="top">
  <div><h1>Eleven | GTM operating model</h1><p class="sub">M1 = Nov 2026. Annual prepay. Spend steps up on milestones. Prepared by Tim Douglas.</p></div>
  <div class="presets" role="group" aria-label="Scenario presets" id="presets"></div>
</header>
<div class="layout">
  <aside id="aside" aria-label="Model inputs"></aside>
  <main id="main"></main>
</div>
<dialog id="copyDlg">
  <h3 id="copyTitle" style="margin-top:0">Copy file contents</h3>
  <p class="lead" style="margin-bottom:8px">Downloads aren’t available in this view. Copy the text below and paste it into a file.</p>
  <textarea id="copyText" readonly></textarea>
  <div class="btns"><button id="copyClose">Close</button></div>
</dialog>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>
<script>
/* ===== price book (Playbk), reference only ===== */
const MODS = ['property','financial','family'];
const MOD = {
  property:  { label:'Property',  unit:'properties',     tiers:[[3,15000],[5,30000],[10,45000],[20,60000],[Infinity,80000]] },
  financial: { label:'Financial', unit:'entities',       tiers:[[50,25000],[100,40000],[200,70000],[400,100000],[Infinity,140000]] },
  family:    { label:'Family',    unit:'trusts',         tiers:[[5,15000],[10,25000],[Infinity,40000]] }
};
function tierOf(m, v){ const n = Math.max(1, Math.round(v)); const t = MOD[m].tiers; for (let i = 0; i < t.length; i++) if (n <= t[i][0]) return {tier:i+1, price:t[i][1]}; return {tier:5, price:t[4][1]}; }
const BUCKETS = ['COGS','Customer success','R&D','Sales & marketing','G&A'];
const BK = {'COGS':'cogs','Customer success':'cs','R&D':'rd','Sales & marketing':'sm','G&A':'ga'};
const STATUSES = ['Workbook estimate','Check overlap','Confirmed','Needs input'];

const PRESETS = {
  cons: { label:'Conservative', target:2,    ramp:{on:true, r1:0.5,  r2:1,    m2:6, m3:12}, blend:50000, renew:90 },
  real: { label:'Realistic',    target:3,    ramp:{on:true, r1:1,    r2:2,    m2:6, m3:12},  blend:60000, renew:95 },
  up:   { label:'Upside',       target:4,    ramp:{on:true, r1:1.5,  r2:3,    m2:6, m3:12},  blend:70000, renew:97 }
};
const DEFAULT = {
  version:3, preset:'real', startMonth:'2026-11', horizon:36, cash:7500000,
  raises:[ {id:'t1', name:'Seed extension', amt:1000000, mo:4}, {id:'t2', name:'Series A', amt:0, mo:24} ],
  existing:[ {id:'e1', name:'Rafferty Holdings', arr:56000, renew:'2027-10'} ],
  eng:{ target:3, ramp:{on:true, r1:1, r2:2, m2:6, m3:12}, blend:60000, uplift:0, renew:95, credit:2, implPct:20, cac:2000 },
  opex:{ today:{cogs:23062, cs:26642, rd:149966, sm:74312, ga:37733}, raise:{cogs:0, cs:12000, rd:0, sm:26000, ga:0}, fam:{cogs:2000, cs:13000, rd:0, sm:54000, ga:3000}, n:6 },
  pf:{ financial:98, property:3, family:12, disc:20 }, pfTrusts:true, rampV2:true, rampV3:true, costsWB:true, spendLines:true, cash75:true,
  spend:[
    {id:'s1', bucket:'COGS', name:'Hosting and infrastructure', hc:0, monthly:14529, status:'Workbook estimate'},
    {id:'s2', bucket:'COGS', name:'Third-party data feeds (Yodlee, EODHD)', hc:0, monthly:1250, status:'Workbook estimate'},
    {id:'s3', bucket:'COGS', name:'Customer support', hc:1, monthly:7283, status:'Workbook estimate'},
    {id:'s4', bucket:'Customer success', name:'VP Customer Success', hc:1, monthly:17442, status:'Check overlap'},
    {id:'s5', bucket:'Customer success', name:'Customer success associate', hc:1, monthly:9200, status:'Workbook estimate'},
    {id:'s6', bucket:'R&D', name:'Engineering team', hc:0, monthly:95000, status:'Workbook estimate'},
    {id:'s7', bucket:'R&D', name:'Product management and support', hc:0, monthly:39333, status:'Check overlap'},
    {id:'s8', bucket:'R&D', name:'UI/UX designer', hc:1, monthly:11775, status:'Workbook estimate'},
    {id:'s9', bucket:'R&D', name:'Dev tools and embedded libraries', hc:0, monthly:3858, status:'Workbook estimate'},
    {id:'s10', bucket:'Sales & marketing', name:'VP Sales', hc:1, monthly:14375, status:'Check overlap'},
    {id:'s11', bucket:'Sales & marketing', name:'Inside sales rep', hc:1, monthly:7188, status:'Workbook estimate'},
    {id:'s12', bucket:'Sales & marketing', name:'Marketing manager', hc:1, monthly:13417, status:'Check overlap'},
    {id:'s13', bucket:'Sales & marketing', name:'Travel and expenses', hc:0, monthly:5000, status:'Workbook estimate'},
    {id:'s14', bucket:'Sales & marketing', name:'Marketing programs', hc:0, monthly:8333, status:'Workbook estimate'},
    {id:'s15', bucket:'Sales & marketing', name:'Current GTM fractional and tools (not in workbook)', hc:1.5, monthly:26000, status:'Confirmed'},
    {id:'s16', bucket:'G&A', name:'Controller', hc:1, monthly:10000, status:'Workbook estimate'},
    {id:'s17', bucket:'G&A', name:'Bookkeeper', hc:1, monthly:7083, status:'Workbook estimate'},
    {id:'s18', bucket:'G&A', name:'Executive assistant', hc:1, monthly:11500, status:'Workbook estimate'},
    {id:'s19', bucket:'G&A', name:'Security and compliance (SOC 2, pen test, HIPAA, PCI)', hc:0, monthly:9150, status:'Workbook estimate'}
  ],
  cap:{ onboardHrs:80, agentOn:true, agentCut:40, ongoingHrs:10, csHrs:130, csRaise:0.5, csFam:1, quota:600000, founder:0.5, sellToday:1, sellFam:1 },
  baseline:null, actuals:{}
};
const clone = o => JSON.parse(JSON.stringify(o));
function migrate(s){
  const d = clone(DEFAULT); if (!s || typeof s !== 'object') return d;
  if (s.version === 3){ const o = Object.assign(d, s);
    o.eng = Object.assign(clone(DEFAULT.eng), s.eng || {}); o.eng.ramp = Object.assign(clone(DEFAULT.eng.ramp), (s.eng || {}).ramp || {});
    o.opex = Object.assign(clone(DEFAULT.opex), s.opex || {}); ['today','raise','fam'].forEach(k => o.opex[k] = Object.assign(clone(DEFAULT.opex[k]), (s.opex || {})[k] || {}));
    o.pf = Object.assign(clone(DEFAULT.pf), s.pf || {}); if (!s.pfTrusts){ o.pf = clone(DEFAULT.pf); o.pfTrusts = true; }
    if (!s.rampV2){ o.eng.target = DEFAULT.eng.target; o.eng.ramp = clone(DEFAULT.eng.ramp); o.preset = 'real'; o.rampV2 = true; }
    if (!s.rampV3){ o.eng.target = DEFAULT.eng.target; o.eng.ramp = clone(DEFAULT.eng.ramp); o.preset = 'real'; o.rampV3 = true; }
    if (!s.costsWB){ o.opex.today = clone(DEFAULT.opex.today); o.costsWB = true; }
    if (!s.spendLines || !Array.isArray(s.spend)){ o.spend = clone(DEFAULT.spend); o.spendLines = true; }
    o.cap = Object.assign(clone(DEFAULT.cap), s.cap || {});
    if (!s.cash75){ if (!num(s.cash)) o.cash = DEFAULT.cash; o.cash75 = true; } o.actuals = s.actuals || {}; return o; }
  /* from the detailed version: keep what carries over, park the rest */
  if (s.version === 2){
    if (s.cash) d.cash = s.cash;
    if (Array.isArray(s.existing)) d.existing = s.existing;
    if (Array.isArray(s.raises) && s.raises.some(t => Number(t.amt))) d.raises = s.raises.map(t => ({id:t.id, name:t.name, amt:Number(t.amt) || 0, mo:/^\d+$/.test(String(t.when)) ? Number(t.when) : 24}));
    if (Array.isArray(s.spend)){ const t = {cogs:0, cs:0, rd:0, sm:0, ga:0}; s.spend.forEach(l => { const k = BK[l.bucket]; if (k) t[k] += Number(l.monthly) || 0; }); d.opex.today = t; }
    if (s.pf) d.pf = Object.assign(d.pf, s.pf);
    if (s.baseline) d.baseline = s.baseline; if (s.actuals) d.actuals = s.actuals;
    d.parkedDetailed = s;
  }
  return d;
}
let state = clone(DEFAULT);
try { const s = localStorage.getItem('eleven-gtm-model-v3') || localStorage.getItem('eleven-gtm-model-v2'); if (s) state = migrate(JSON.parse(s)); } catch (e) {}

/* ===== helpers ===== */
let uid = 1; const nid = p => p + Date.now().toString(36) + (uid++);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
function money(v){ const a = Math.abs(v); const s = a >= 1e6 ? '$' + (a/1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M' : a >= 1e4 ? '$' + Math.round(a/1e3) + 'K' : '$' + Math.round(a).toLocaleString('en-US'); return (v < 0 ? '-' : '') + s; }
const full = v => (v < 0 ? '-' : '') + '$' + Math.round(Math.abs(v)).toLocaleString('en-US');
function parseAmt(str){ const t = String(str).trim().toUpperCase().replace(/[$,\s]/g, ''); const m = t.match(/^(-?\d*\.?\d+)([KM]?)$/); if (!m) return null; return Math.round(parseFloat(m[1]) * (m[2] === 'M' ? 1e6 : m[2] === 'K' ? 1e3 : 1)); }
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function ymOf(i){ const [y0,m0] = state.startMonth.split('-').map(Number); const t = (m0-1) + i; return [y0 + Math.floor(t/12), ((t%12)+12)%12]; }
const mLabel = i => { const [y,m] = ymOf(i); return MN[m] + ' ' + String(y).slice(2); };
const mLong = i => { const [y,m] = ymOf(i); return MN[m] + ' ' + y; };
const mISO = i => { const [y,m] = ymOf(i); return y + '-' + String(m+1).padStart(2,'0'); };
const mName = i => 'M' + (i+1) + ', ' + mLong(i);
function mIdx(ym){ if (!ym) return Infinity; const [y,m] = ym.split('-').map(Number); const [y0,m0] = state.startMonth.split('-').map(Number); return (y-y0)*12 + (m-m0); }

/* ===== engine ===== */
function spendToday(){ const t = {}; BUCKETS.forEach(b => t[b] = 0); state.spend.forEach(l => { if (t[l.bucket] !== undefined) t[l.bucket] += num(l.monthly); }); return t; }
function model(){
  const e = state.eng, H = state.horizon, H2 = H + 12;
  const up = num(e.uplift)/100, renew = num(e.renew)/100, pct = num(e.implPct)/100, credit = Math.min(12, num(e.credit));
  /* pricing basis: one blended ARR per customer, stepping up by the uplift at each anniversary */
  const list = [], per = [];
  for (let t = 0; t < H2; t++){ const yrs = Math.floor(t/12); per.push(num(e.blend) * Math.pow(1 + up, yrs) * Math.pow(renew, yrs)); list.push(per[t]); }
  const sign = []; for (let i = 0; i < H2; i++){ const M = i + 1, r = e.ramp; sign.push(!r.on ? num(e.target) : M >= r.m3 ? num(e.target) : M >= r.m2 ? num(r.r2) : num(r.r1)); }
  const fam = [], arr = [], coll = [], impl = [];
  for (let i = 0; i < H2; i++){
    let f = 0, a = 0, c = 0, im = 0;
    for (let m = 0; m <= i; m++){ const n = sign[m]; if (!n) continue; const age = i - m;
      f += n * Math.pow(renew, Math.floor(age/12)); a += n * per[age];
      if (age === 0){ c += n * per[0] * (1 - credit/12); im += n * pct * list[0]; }
      else { c += n * (age % 12 === 0 ? per[age] : Math.max(0, per[age] - per[age-1]) * (12 - age % 12)/12); im += n * pct * Math.max(0, list[age] - list[age-1]); } }
    state.existing.forEach(x => { const r = mIdx(x.renew); const passed = i >= r ? Math.floor((i - r)/12) + 1 : 0; const sv = Math.pow(renew, passed);
      f += sv; a += num(x.arr) * sv; if (i >= r && (i - r) % 12 === 0) c += num(x.arr) * sv; });
    fam.push(f); arr.push(a); coll.push(c + im); impl.push(im);
  }
  /* opex steps on milestones */
  const funded = state.raises.filter(t => num(t.amt) > 0).map(t => num(t.mo) - 1);
  const step2 = funded.length ? Math.max(0, Math.min(...funded)) : Infinity;
  let step3 = Infinity; for (let i = 1; i < H; i++) if (fam[i-1] >= num(state.opex.n) - 1e-9){ step3 = Math.max(i, step2 === Infinity ? i : i); break; }
  const z = () => new Array(H).fill(0); const byB = {}; BUCKETS.forEach(b => byB[b] = z());
  const o = state.opex, todayB = spendToday();
  for (let i = 0; i < H; i++) BUCKETS.forEach(b => { const k = BK[b]; byB[b][i] = todayB[b] + (i >= step2 ? num(o.raise[k]) : 0) + (i >= step3 ? num(o.fam[k]) : 0); });
  for (let i = 0; i < H; i++) byB['Sales & marketing'][i] += sign[i] * num(e.cac);
  const spend = z().map((_, i) => BUCKETS.reduce((s, b) => s + byB[b][i], 0));
  const raise = z(); state.raises.forEach(t => { const i = num(t.mo) - 1; if (i >= 0 && i < H) raise[i] += num(t.amt); });
  const net = [], cash = [], cum = []; let bal = num(state.cash), c2 = 0;
  for (let i = 0; i < H; i++){ const n = coll[i] - spend[i]; net.push(n); c2 += n; cum.push(c2); bal += n + raise[i]; cash.push(bal); }
  let payg = -1; for (let i = 0; i < H; i++){ if (net[i] >= 0 && net.slice(i).every(v => v >= 0)){ payg = i; break; } }
  let trough = 0; for (let i = 1; i < H; i++) if (cum[i] < cum[trough]) trough = i;
  let low = 0; for (let i = 1; i < H; i++) if (cash[i] < cash[low]) low = i;
  let out = -1; for (let i = 0; i < H; i++) if (cash[i] < 0){ out = i; break; }
  const ca = state.cap, csToday = state.spend.filter(l => l.bucket === 'Customer success').reduce((t, l) => t + num(l.hc), 0);
  const csReq = z().map((_, i) => (sign[i] * num(ca.onboardHrs) * (ca.agentOn ? 1 - num(ca.agentCut)/100 : 1) + fam[i] * num(ca.ongoingHrs)) / Math.max(1, num(ca.csHrs)));
  const csPlan = z().map((_, i) => csToday + (i >= step2 ? num(ca.csRaise) : 0) + (i >= step3 ? num(ca.csFam) : 0));
  const sellReq = z().map((_, i) => { let s = 0; for (let j = i; j < i + 12; j++) s += sign[j] * per[0]; return s / Math.max(1, num(ca.quota)); });
  const sellPlan = z().map((_, i) => num(ca.founder) + num(ca.sellToday) + (i >= step3 ? num(ca.sellFam) : 0));
  return {H, sign, fam, arr, coll, impl, list, per, byB, spend, raise, net, cash, cum, payg, bridge:Math.max(0, -cum[trough]), low, out, step2, step3, csReq, csPlan, sellReq, sellPlan};
}

let dbRef = null, writing = false, pending = false, saveTimer = null, dirty = false;
function setSave(t){ const el = document.getElementById('saveNote'); if (el) el.textContent = t; }
function scheduleSave(){
  dirty = true; try { localStorage.setItem('eleven-gtm-model-v3', JSON.stringify(state)); } catch (e) {}
  if (!dbRef){ setSave('Saved on this device'); return; }
  setSave('Saving…'); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 800);
}
async function flush(){ if (!dbRef) return; if (writing){ pending = true; return; } writing = true;
  try { await dbRef.set(clone(state)); setSave('Saved'); } catch (e) { setSave('Not synced, saved on this device'); }
  writing = false; if (pending){ pending = false; flush(); } }
(async () => {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  try { const db = await window.claude.use('db'); if (!db) return; const ref = db.doc('plan/current');
    const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))]); dbRef = ref;
    if (snap.exists && !dirty){ state = migrate(snap.data()); renderAll(); setSave('Saved'); if (snap.data().version !== 3) flush(); }
    else if (dirty) flush(); else setSave('Saved');
  } catch (e) { setSave('Saved on this device'); }
})();

}

function chart(series, opts){
  const W = 860, H = opts.h || 280, L = 64, R = 12, T = 14, B = 28; const n = series[0].vals.length;
  const all = series.flatMap(s => s.vals); let lo = Math.min(0, ...all), hi = Math.max(1, ...all); const pad = (hi - lo) * 0.1; hi += pad; if (lo < 0) lo -= pad;
  const bw = (W - L - R)/n, x = i => L + bw*(i + 0.5), y = v => T + (H - T - B)*(1 - (v - lo)/(hi - lo));
  let g = '<g class="grid">';
  for (let k = 0; k <= 4; k++){ const v = lo + (hi - lo)*k/4; g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${opts.fmt(v)}</text>`; }
  g += '</g>';
  for (let i = 0; i < n; i += 3) g += `<text x="${x(i)}" y="${H-9}" text-anchor="middle">${mLabel(i)}</text>`;
  if (lo < 0) g += `<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)"/>`;
  series.filter(s => s.type === 'bar').forEach(s => s.vals.forEach((v, i) => { const y0 = y(0), y1 = y(v);
    g += `<rect x="${x(i) - bw*0.36}" width="${bw*0.72}" y="${Math.min(y0, y1)}" height="${Math.max(1, Math.abs(y1 - y0))}" fill="${v >= 0 ? s.color : s.neg}" opacity=".85"/>`; }));
  series.filter(s => s.type !== 'bar').forEach(s => { g += `<polyline fill="none" stroke="${s.color}" stroke-width="2.4" ${s.dash ? 'stroke-dasharray="6 4"' : ''} points="${s.vals.map((v, i) => x(i) + ',' + y(v)).join(' ')}"/>`; });
  (opts.marks || []).forEach(mk => { if (mk.i < 0 || mk.i >= n) return; const px = x(mk.i);
    g += `<line x1="${px}" x2="${px}" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
    const rows = [mk.title].concat(mk.lines); const w = 132, h = rows.length*15 + 8; let bx = px + 6; if (bx + w > W - R) bx = px - 6 - w;
    g += `<rect x="${bx}" y="${T+2}" width="${w}" height="${h}" rx="3" fill="var(--surface)" stroke="var(--line)"/>`;
    rows.forEach((t, k) => { g += `<text x="${bx+7}" y="${T+16+k*15}" style="${k === 0 ? 'font-weight:700;fill:var(--ink)' : ''}">${esc(t)}</text>`; }); });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label)}">${g}</svg>
  <div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}
function januaries(R){ const out = []; for (let i = 12; i < R.H; i++) if (ymOf(i)[1] === 0) out.push(i); return out; }
const marks = R => januaries(R).map(i => ({i, title:mLong(i), lines:['ARR ' + money(R.arr[i]), 'Families ' + R.fam[i].toFixed(1), 'Cash ' + money(R.cash[i])]}));

    <div class="btns"><button data-act="csv">Download operating plan CSV</button><button class="ghost" data-act="backup">Download backup</button><button class="ghost" data-act="restore">Restore from backup</button><button class="ghost" data-act="reset">Reset to starting values</button></div></details>
  <details class="chartblock"><summary><b>Price a family</b></summary><p style="margin-top:8px">The Playbk price book, for scoping deals and sanity-checking the blended ARR. Modules are priced independently and summed. Implementation is a one-time fee on net platform fees. Loaded with Rafferty’s scope.</p>
    <div class="statgrid">${MODS.map(m => `<label class="sm" style="display:flex;flex-direction:column;gap:4px">${MOD[m].label}, ${MOD[m].unit}${inp(`pf.${m}`, state.pf[m], 'number', 'min="0" step="1"')}</label>`).join('')}
    <label class="sm" style="display:flex;flex-direction:column;gap:4px">Platform discount (%)${inp('pf.disc', state.pf.disc, 'number', 'min="0" max="50" step="1"')}</label></div>
    <div class="scroll" style="margin-top:12px" data-out="priceTable"></div><div class="btns"><button class="ghost" data-act="rafferty">Load Rafferty’s scope</button></div></details>
  <div class="foot">Mechanics model, not a forecast. Each new family signs at the blended ARR per customer, net of discounts, and steps up by the uplift at each anniversary. Billing is annual prepay: a family pays a year at signing less the year-one credit, and each anniversary renews the then-current ARR at the renewal rate. Implementation is collected at signing, as a share of ARR. Spend is today’s bucket totals, stepping up once the first raise lands and again once the set number of families are live, plus sales cost per new family. Pay-as-we-go is the first month net cash turns positive and holds through the horizon. Spend today is the sum of the line-by-line Current spend section. Module cross-sell and role-by-role hiring stay parked until there are three to five live customers.</div>`;
}

const OUT = {};
const OPEN = new Set();
document.addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.sec){ if (d.open) OPEN.add(d.dataset.sec); else OPEN.delete(d.dataset.sec); } }, true);
OUT.derived = R => `ARR per new customer: <b>${money(R.per[0])}</b>. Cash at signing per family: <b>${money(R.per[0]*(1 - num(state.eng.credit)/12) + num(state.eng.implPct)/100*R.list[0])}</b>, a year prepaid less the credit, plus implementation. ARR at the second anniversary: <b>${money(num(state.eng.blend)*Math.pow(1 + num(state.eng.uplift)/100, 2))}</b>.`;
OUT.opT0 = () => money(Object.values(spendToday()).reduce((s, v) => s + v, 0));
['1','2'].forEach((k, j) => OUT['opT' + k] = () => money(Object.values(state.opex[['raise','fam'][j]]).reduce((s, v) => s + num(v), 0)));
BUCKETS.forEach(b => OUT['td-' + BK[b]] = () => money(spendToday()[b]));
OUT.spendFlag = () => { const n = state.spend.filter(l => l.status === 'Check overlap').length, w = state.spend.filter(l => l.status === 'Workbook estimate' || l.status === 'Needs input').length;
  return n ? `<div class="callout">${n} lines may double count spend already elsewhere in the plan, and ${w} are workbook estimates not yet confirmed against actuals.</div>` : w ? `<div class="callout">${w} lines are workbook estimates not yet confirmed against actuals.</div>` : `<div class="callout ok">Every line is confirmed.</div>`; };
OUT.spendTotals = () => { const t = spendToday(); const hc = b => state.spend.filter(l => l.bucket === b).reduce((s, l) => s + num(l.hc), 0);
  return `<table><thead><tr><th>Bucket</th><th class="num">Headcount</th><th class="num">Monthly</th><th class="num">Annual</th></tr></thead><tbody>${BUCKETS.map(b => `<tr><td>${b}</td><td class="num">${hc(b)}</td><td class="num">${full(t[b])}</td><td class="num">${money(t[b]*12)}</td></tr>`).join('')}
  <tr class="tot"><td><b>Total</b></td><td class="num"><b>${BUCKETS.reduce((s, b) => s + hc(b), 0)}</b></td><td class="num"><b>${full(Object.values(t).reduce((s, v) => s + v, 0))}</b></td><td class="num"><b>${money(Object.values(t).reduce((s, v) => s + v, 0)*12)}</b></td></tr></tbody></table>`; };
OUT.csChart = R => chart([{name:'CS FTE needed', vals:R.csReq, color:'var(--amber-line)'}, {name:'CS FTE planned', vals:R.csPlan, color:'var(--blue)'}], {fmt:v => v.toFixed(1), label:'Customer Success FTE needed vs planned', marks:marks(R), h:230});
OUT.csToday = () => state.spend.filter(l => l.bucket === 'Customer success').reduce((t, l) => t + num(l.hc), 0).toFixed(1);
OUT.capSummary = R => { const short = (need, have) => { for (let i = 0; i < R.H; i++) if (have[i] + 0.05 < need[i]) return i; return -1; };
  const cs = short(R.csReq, R.csPlan), sl = short(R.sellReq, R.sellPlan);
  const msg = (name, i, need, have) => i < 0 ? `${name} covers the plan through M${R.H}.` : `${name} falls short from ${mName(i)}: ${have[R.H-1].toFixed(1)} planned against ${need[R.H-1].toFixed(1)} needed by M${R.H}.`;
  return `<div class="callout${cs < 0 && sl < 0 ? ' ok' : ''}">${msg('Customer Success', cs, R.csReq, R.csPlan)} ${msg('Selling capacity', sl, R.sellReq, R.sellPlan)}</div>`; };
OUT.capTable = R => { const c = (need, have) => `<span class="${have + 0.05 >= need ? 'okv' : 'gap'}">${have.toFixed(1)} of ${need.toFixed(1)}</span>`;
  return `<table><thead><tr><th>Month</th><th class="num">New families</th><th class="num">Families live</th><th class="num">CS FTE, planned of needed</th><th class="num">Sellers, planned of needed</th></tr></thead><tbody>
  ${[2, 5, 11, 17, 23, 35].filter(i => i < R.H).map(i => `<tr><td>M${i+1}, ${mLabel(i)}</td><td class="num">${R.sign[i].toFixed(2)}</td><td class="num">${R.fam[i].toFixed(1)}</td><td class="num">${c(R.csReq[i], R.csPlan[i])}</td><td class="num">${c(R.sellReq[i], R.sellPlan[i])}</td></tr>`).join('')}</tbody></table>`; };
OUT.stepHint = R => `At these settings: step two starts ${R.step2 < R.H ? mName(R.step2) : 'when a raise is entered'}, step three ${R.step3 < R.H ? mName(R.step3) : 'not within ' + R.H + ' months'}.`;
OUT.priceTable = () => { const p = state.pf; let list = 0;
  const rows = MODS.map(m => { const v = num(p[m]); if (!v) return `<tr><td>${MOD[m].label}</td><td class="num">0</td><td>Not included</td><td class="num">$0</td></tr>`;
    const t = tierOf(m, v); list += t.price; return `<tr><td>${MOD[m].label}</td><td class="num">${v}</td><td>Tier ${t.tier}</td><td class="num">${full(t.price)}</td></tr>`; }).join('');
  const disc = list*num(p.disc)/100, net = list - disc, impl = net*num(state.eng.implPct)/100, y1 = net*(1 - num(state.eng.credit)/12);
  return `<table><thead><tr><th>Module</th><th class="num">Volume</th><th>Tier</th><th class="num">List, annual</th></tr></thead><tbody>${rows}
  <tr><td><b>List platform fees</b></td><td></td><td></td><td class="num"><b>${full(list)}</b></td></tr><tr><td>Discount (${num(p.disc)}%)</td><td></td><td></td><td class="num">-${full(disc)}</td></tr>
  <tr><td><b>Net ACV</b></td><td></td><td></td><td class="num"><b>${full(net)}</b></td></tr><tr><td>Implementation (${num(state.eng.implPct)}% of net platform fees)</td><td></td><td></td><td class="num">${full(impl)}</td></tr>
  <tr><td>Year one platform fees, less ${num(state.eng.credit)}-month credit</td><td></td><td></td><td class="num">${full(y1)}</td></tr><tr><td><b>Cash at signing</b></td><td></td><td></td><td class="num"><b>${full(y1 + impl)}</b></td></tr></tbody></table>`; };
function planRows(R){ const H = R.H, sl = a => a.slice(0, H);
  return [['Collections', sl(R.coll)], ['Of which implementation fees', sl(R.impl)], ['ARR, end of month', sl(R.arr)], ...BUCKETS.map(b => [b, R.byB[b]]),
    ['Total spend', R.spend, 'tot'], ['Net cash', R.net], ['Raises', R.raise], ['Cash balance', R.cash, 'tot'], ['Families on the platform', sl(R.fam), 'n'], ['New families signed', sl(R.sign), 'n']]; }
OUT.planTable = R => `<table><thead><tr><th>Line</th>${R.spend.map((_, i) => `<th class="num">M${i+1}<br>${mLabel(i)}</th>`).join('')}</tr></thead><tbody>
  ${planRows(R).map(([n, v, t]) => `<tr class="${t === 'tot' ? 'tot' : ''}"><td>${n}</td>${v.map(x => `<td class="num ${t !== 'n' && x < -0.5 ? 'gap' : ''}">${t === 'n' ? x.toFixed(1) : money(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
function csv(){ const R = model(); const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const rows = [['Line', ...R.spend.map((_, i) => mISO(i))].map(q).join(',')];
  planRows(R).forEach(([n, v, t]) => rows.push([n, ...v.map(x => t === 'n' ? x.toFixed(2) : Math.round(x))].map(q).join(','))); return rows.join('\n'); }
function todayIdx(){ const d = new Date(); return (d.getFullYear() - +state.startMonth.slice(0, 4))*12 + (d.getMonth() + 1 - +state.startMonth.slice(5, 7)); }
function trackRows(){ const b = state.baseline; if (!b) return []; const keys = Object.keys(state.actuals).map(Number).filter(k => { const a = state.actuals[k]; return a && (a.nf !== '' || a.arr !== '' || a.cash !== ''); });
  const n = Math.min(b.fam.length, Math.max(3, todayIdx() + 2, ...keys.map(k => k + 2))); let cum = b.fam0; const out = [];
  for (let i = 0; i < n; i++){ const a = state.actuals[i] || {}; const has = a.nf !== undefined && a.nf !== ''; if (has) cum += num(a.nf);
    out.push({i, planFam:b.fam[i], nf:a.nf ?? '', actFam: has ? cum : null, planArr:b.arr[i], arr:a.arr ?? '', planCash:b.cash[i], cash:a.cash ?? ''}); } return out; }
OUT.trackTable = () => { const dv = (a, p, f) => a === '' || a === null ? '' : `<span class="${a - p >= 0 ? 'okv' : 'gap'}">${a - p >= 0 ? '+' : ''}${f(a - p)}</span>`;
  return `<table><thead><tr><th>Month</th><th class="num">Families, plan</th><th class="num">New families, actual</th><th class="num">Families, actual</th><th class="num">vs plan</th><th class="num">ARR, plan</th><th class="num">ARR, actual</th><th class="num">vs plan</th><th class="num">Cash, plan</th><th class="num">Cash, actual</th><th class="num">vs plan</th></tr></thead><tbody>
  ${trackRows().map(r => `<tr><td>M${r.i+1}, ${mLabel(r.i)}</td><td class="num">${r.planFam.toFixed(1)}</td>
    <td class="num"><input type="number" step="1" min="0" data-act-in="nf" data-i="${r.i}" value="${esc(r.nf)}" aria-label="New families signed, actual"></td>
    <td class="num">${r.actFam === null ? '' : r.actFam.toFixed(0)}</td><td class="num">${dv(r.actFam, r.planFam, v => v.toFixed(1))}</td>
    <td class="num">${money(r.planArr)}</td><td class="num"><input type="text" inputmode="numeric" data-act-in="arr" data-i="${r.i}" value="${r.arr === '' ? '' : full(num(r.arr))}" aria-label="ARR, actual"></td><td class="num">${dv(r.arr === '' ? '' : num(r.arr), r.planArr, money)}</td>
    <td class="num">${money(r.planCash)}</td><td class="num"><input type="text" inputmode="numeric" data-act-in="cash" data-i="${r.i}" value="${r.cash === '' ? '' : full(num(r.cash))}" aria-label="Cash, actual"></td><td class="num">${dv(r.cash === '' ? '' : num(r.cash), r.planCash, money)}</td></tr>`).join('')}</tbody></table>`; };

function refresh(){
  const R = model(); window.__R = R; const H = R.H, last = H - 1;
  document.getElementById('h-payg').textContent = R.payg < 0 ? 'Not yet' : 'M' + (R.payg + 1);
  document.getElementById('h-low').textContent = money(R.cash[R.low]);
  document.getElementById('h-label').textContent = R.payg < 0 ? `Collections don’t cover spend within ${H} months at these settings. Low point ${mLong(R.low)}.` : `${mLong(R.payg)}: the month collections exceed spend and stay there, at these settings. Low point ${mLong(R.low)}.`;
  const noCash = num(state.cash) === 0;
  document.getElementById('stats').innerHTML = [
    [money(R.bridge), 'One-time bridge to reach pay-as-we-go, before raises'],
    [noCash ? 'Enter cash' : R.out < 0 ? 'Funded through M' + H : 'Out of cash M' + (R.out + 1), 'Runway with capital raised'],
    [R.payg < 0 ? 'n/a' : R.fam[R.payg].toFixed(1), 'Families on the platform at pay-as-we-go'],
    [money(R.arr[last]), `ARR at M${H}, ${R.fam[last].toFixed(0)} families`],
    [money(R.arr[0]/12) + ' vs ' + money(R.spend[0]), 'Run rate vs monthly spend today']
  ].map(([v, l]) => `<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
  document.getElementById('ch-cash').innerHTML = chart([{name:'Cash balance', vals:R.cash, color:'var(--blue)'}, {name:'ARR', vals:R.arr.slice(0, H), color:'var(--greenl)', dash:true}], {fmt:money, label:'Cash balance and ARR by month', marks:marks(R)});
  document.getElementById('ch-flow').innerHTML = chart([{name:'Net cash', vals:R.net, color:'var(--greenl)', neg:'var(--red)', type:'bar'}, {name:'Collections', vals:R.coll.slice(0, H), color:'var(--blue)'}, {name:'Spend', vals:R.spend, color:'var(--amber-line)'}], {fmt:money, label:'Monthly collections, spend and net cash', h:240});
  const sustain = R.spend.map((s, i) => { const apf = R.fam[i] > 0 ? R.arr[i]/R.fam[i] : R.per[0]; return apf > 0 ? s/(apf/12) : 0; });
  document.getElementById('ch-fam').innerHTML = chart([{name:'Families on the platform', vals:R.fam.slice(0, H), color:'var(--blue)'}, {name:'Sustain target', vals:sustain, color:'var(--muted)', dash:true}], {fmt:v => v.toFixed(0), label:'Families on the platform with the sustain target', marks:marks(R)});
  document.querySelectorAll('output[data-for]').forEach(o => { o.textContent = FMT[o.dataset.fmt](getPath(o.dataset.for)); });
  document.querySelectorAll('[data-out]').forEach(el => { const f = OUT[el.dataset.out]; if (f) el.innerHTML = f(R); });
  document.querySelectorAll('#presets button[data-preset]').forEach(b => b.classList.toggle('active', b.dataset.preset === state.preset));
}
function renderAll(){ renderAside(); renderMain(); refresh(); }

/* ===== events ===== */
document.getElementById('presets').innerHTML = Object.entries(PRESETS).map(([k, p]) => `<button data-preset="${k}">${p.label}</button>`).join('');
document.getElementById('presets').addEventListener('click', e => { const b = e.target.closest('button[data-preset]'); if (!b) return; const p = PRESETS[b.dataset.preset];
  Object.assign(state.eng, {target:p.target, ramp:clone(p.ramp), blend:p.blend, renew:p.renew}); state.preset = b.dataset.preset; scheduleSave(); renderAll(); });
function onField(e){
  const t = e.target;
  if (t.dataset && t.dataset.actIn){ if (e.type === 'input' && t.type !== 'number') return; const i = t.dataset.i; const a = state.actuals[i] = state.actuals[i] || {nf:'', arr:'', cash:''};
    if (t.dataset.actIn === 'nf') a.nf = t.value; else { const v = t.value.trim() === '' ? '' : parseAmt(t.value); if (v === null) return; a[t.dataset.actIn] = v; }
    scheduleSave(); if (e.type === 'change'){ const el = document.querySelector('[data-out="trackTable"]'); if (el) el.innerHTML = OUT.trackTable(); } return; }
  if (!t.dataset || !t.dataset.k) return;
  if (e.type === 'input' && (t.type === 'checkbox' || t.tagName === 'SELECT' || t.type === 'month')) return;
  let val;
  if (t.type === 'checkbox') val = t.checked;
  else if (t.hasAttribute('data-amt')){ const v = parseAmt(t.value); if (v === null) return; val = v; if (e.type === 'change') t.value = t.hasAttribute('data-k-short') ? money(v) : full(v); }
  else if (t.hasAttribute('data-num') || t.tagName === 'SELECT' && /\.(mo|m2|m3)$/.test(t.dataset.k)) val = num(t.value);
  else val = t.value;
  if (t.type === 'month' && !val) return;
  setPath(t.dataset.k, val);
  if (['eng.target','eng.ramp','eng.blend','eng.renew'].some(p => t.dataset.k.startsWith(p))) state.preset = '';
  if (t.dataset.k === 'eng.ramp.m2' && num(state.eng.ramp.m3) <= val) state.eng.ramp.m3 = Math.min(state.horizon, val + 1);
  scheduleSave();
  if (e.type === 'change' && t.hasAttribute('data-full')) renderAll(); else refresh();
}
document.addEventListener('input', onField); document.addEventListener('change', onField);
document.addEventListener('focusin', e => { const t = e.target; if (t.hasAttribute && t.hasAttribute('data-k-short')) { t.value = full(num(getPath(t.dataset.k))); t.select(); } });
document.addEventListener('focusout', e => { const t = e.target; if (t.hasAttribute && t.hasAttribute('data-k-short')) t.value = money(num(getPath(t.dataset.k))); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
  if (a === 'del') state[b.dataset.list].splice(+b.dataset.i, 1);
  else if (a === 'addRaise') state.raises.push({id:nid('t'), name:'Raise ' + (state.raises.length + 1), amt:500000, mo:13});
  else if (a === 'addSpend') state.spend.push({id:nid('s'), bucket:'G&A', name:'New line', hc:0, monthly:0, status:'Needs input'});
  else if (a === 'addExisting') state.existing.push({id:nid('e'), name:'New customer', arr:25000, renew:mISO(11)});
  else if (a === 'rafferty') state.pf = clone(DEFAULT.pf);
  else if (a === 'lock'){ if (state.baseline && !confirm('Replace the locked baseline with the current settings? Actuals you entered stay.')) return;
    const R = model(); state.baseline = {at:new Date().toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}), fam:R.fam.slice(0, R.H).map(v => +v.toFixed(3)), arr:R.arr.slice(0, R.H).map(Math.round), cash:R.cash.map(Math.round), fam0:state.existing.length}; }
  else if (a === 'clearActuals'){ if (!confirm('Clear every actual you entered?')) return; state.actuals = {}; }
  else if (a === 'trackCsv'){ const q = s => '"' + String(s).replace(/"/g, '""') + '"'; const rows = [['Month','Families plan','New families actual','Families actual','ARR plan','ARR actual','Cash plan','Cash actual'].map(q).join(',')];
    trackRows().forEach(r => rows.push([mISO(r.i), r.planFam.toFixed(2), r.nf, r.actFam ?? '', r.planArr, r.arr, r.planCash, r.cash].map(q).join(','))); offerFile('eleven-track-against-plan.csv', rows.join('\n')); return; }
  else if (a === 'csv'){ offerFile('eleven-operating-plan.csv', csv()); return; }
  else if (a === 'backup'){ offerFile('eleven-gtm-model-backup.json', JSON.stringify(state, null, 2)); return; }
  else if (a === 'restore'){ document.getElementById('restoreFile').click(); return; }
  else if (a === 'reset'){ if (!confirm('Reset every input to the starting values? Download a backup first if you want to keep this version.')) return; state = clone(DEFAULT); }
  else return;
  scheduleSave(); renderAll();
});
document.getElementById('restoreFile').addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return;
  try { state = migrate(JSON.parse(await f.text())); scheduleSave(); renderAll(); } catch (err) { alert('That file isn’t a backup from this model. Choose the JSON file from “Download backup”.'); }
  e.target.value = ''; });
renderAll();

</script>
</body>
