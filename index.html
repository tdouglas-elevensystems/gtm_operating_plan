<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eleven | GTM operating model</title>
<style>
:root{
  --bg:#F7F5F0;--surface:#FFFFFF;--aside:#EFEDE7;--ink:#1B2430;--muted:#5B6675;--navy:#0F3D6B;--blue:#185FA5;--light:#9EC3E8;
  --row:#EAF1F8;--line:#D9DEE5;--amber-bg:#FFF4DC;--amber:#7A4F00;--amber-line:#D9A23A;

  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0E1620;--surface:#15212E;--aside:#111C27;--ink:#E6ECF2;--muted:#9AA8B8;--navy:#0B2A4A;--blue:#74AEE6;--light:#4E7FB0;
  --row:#1A2A3B;--line:#2A3B4E;--amber-bg:#3A2C10;--amber:#F3CB78;--amber-line:#B5862C;
  --green-bg:#133222;--green:#86D6A2;--greenl:#5FBF85;--red:#F08A8A;--head-muted:#9FB6CE;--chip:#123A63;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0E1620;--surface:#15212E;--aside:#111C27;--ink:#E6ECF2;--muted:#9AA8B8;--navy:#0B2A4A;--blue:#74AEE6;--light:#4E7FB0;

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Arial,Helvetica,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
header.top{background:var(--navy);color:#fff;padding:18px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
header h1{font-size:19px;margin:0;font-weight:700}
header .sub{font-size:13px;color:var(--head-muted);margin:2px 0 0}
.presets{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.presets button.active{background:#185FA5;border-color:#185FA5}
.save{font-size:12.5px;color:var(--head-muted)}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:calc(100vh - 70px)}

.ctl{margin-bottom:13px}
.ctl .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:3px}
.ctl label{font-size:13px}

.hint{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
input[type=range]{width:100%;accent-color:var(--blue)}
input:not([type=range]):not([type=checkbox]),select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:5px 7px;min-width:0;width:100%}

.derived{font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;line-height:1.55}
button{font:inherit;font-size:13.5px;cursor:pointer;border-radius:4px;padding:7px 12px;border:1px solid var(--blue);background:var(--blue);color:#fff}
button.ghost{background:transparent;color:var(--blue)}
button.x{background:transparent;border:none;color:var(--muted);padding:2px 6px;font-size:17px;line-height:1}
button.link{background:none;border:none;color:var(--blue);padding:0;font-size:13px;text-decoration:underline}

.headline{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.headline .big{font-size:44px;font-weight:700;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .headline .big{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .headline .big{color:var(--ink)}}
.headline .big.alt{color:var(--blue)}

.hl-label{color:var(--muted);font-size:13.5px;margin:2px 0 16px}

h2.sec{font-size:18px;margin:0 0 4px}
p.lead{margin:0 0 16px;color:var(--muted);max-width:75ch;font-size:13.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:16px}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:700;color:var(--muted);font-size:12px;padding:7px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even) td{background:var(--row)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.gate.met{border-top-color:var(--greenl)}
.gate .crit{display:flex;gap:6px;align-items:center}
.gate ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
.sm{font-size:12.5px;color:var(--muted)}
.gap{color:var(--red);font-weight:700}
.okv{color:var(--green);font-weight:700}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.plan td:first-child,.plan th:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:210px}
.plan tbody tr:nth-child(even) td:first-child{background:var(--row)}
.plan tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.track input{width:90px;text-align:right}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:min(720px,92vw);width:100%}
dialog textarea{width:100%;height:260px;font:12px/1.4 Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line)}
.foot{font-size:12px;color:var(--muted);margin-top:24px;max-width:90ch;line-height:1.55}
@media (max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.gates{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.layout{grid-template-columns:1fr}aside{border-right:none;border-bottom:1px solid var(--line)}main{padding:18px 16px 50px}.rail{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.gates{grid-template-columns:1fr}.headline .big{font-size:34px}header.top{padding:14px 16px}}
</style>
</head>
<body>
<header class="top">
  <div><h1>Eleven | GTM operating model</h1><p class="sub">M1 = Nov 2026. Annual prepay, priced from the Playbk module tiers. Prepared by Tim Douglas.</p></div>
  <div class="presets" role="group" aria-label="Scenario presets" id="presets"></div>
</header>
<div class="layout">
  <aside id="aside" aria-label="Model inputs"></aside>
  <main id="main"></main>
</div>
<dialog id="copyDlg">
  <h3 id="copyTitle" style="margin-top:0">Copy file contents</h3>
  <p class="lead" style="margin-bottom:8px">Downloads aren’t available in this view. Copy the text below and paste it into a file.</p>
  <textarea id="copyText" readonly></textarea>
  <div class="btns"><button id="copyClose">Close</button></div>
</dialog>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>
<script>
/* ===== price book (Playbk) ===== */
const MODS = ['property','financial','family'];
const MOD = {
  property:  { label:'Property',  unit:'properties',     tiers:[[3,15000],[5,30000],[10,45000],[20,60000],[Infinity,80000]] },
  financial: { label:'Financial', unit:'entities',       tiers:[[50,25000],[100,40000],[200,70000],[400,100000],[Infinity,140000]] },
  family:    { label:'Family',    unit:'family members', tiers:[[1,12000],[3,15000],[6,20000],[8,35000],[Infinity,50000]] }
};
function tierOf(m, v){ const n = Math.max(1, Math.round(v)); const t = MOD[m].tiers; for (let i = 0; i < t.length; i++) if (n <= t[i][0]) return {tier:i+1, price:t[i][1]}; return {tier:5, price:t[4][1]}; }
const tierPrice = (m, v) => v > 0 ? tierOf(m, v).price : 0;
const BUCKETS = ['COGS','Customer success','R&D','Sales & marketing','G&A'];
const STATUSES = ['Needs input','Estimate','Actual'];
const SPEED_K = {1:0.08, 2:0.13, 3:0.20, 4:0.27, 5:0.34};
const SPEED_N = {1:'Very slow', 2:'Slow', 3:'Medium', 4:'Fast', 5:'Very fast'};
const TABS = [['gates','Gates'],['price','Price a family'],['spend','Current spend'],['hiring','Hiring'],['marketing','Marketing'],['capacity','Capacity'],['plan','Operating plan'],['track','Track against plan']];

const PRESETS = {
  cons: { label:'Conservative', target:1, ramp:{on:true, r1:0.25, r2:0.5, m2:5, m3:10}, speed:2, c0:10, cmax:25, renew:90, disc:15 },
  real: { label:'Realistic',    target:1.75, ramp:{on:true, r1:0.33, r2:0.75, m2:4, m3:9}, speed:3, c0:15, cmax:40, renew:95, disc:10 },
  up:   { label:'Upside',       target:2.75, ramp:{on:true, r1:0.5, r2:1, m2:4, m3:7}, speed:4, c0:20, cmax:50, renew:97, disc:10 }
};

const DEFAULT = {
  version: 2, preset:'real', implStd:true, spendBroad:true,
  startMonth:'2026-11', horizon:36, cash:0,
  raises:[ {id:'t1', name:'Seed extension', amt:0, when:'3'}, {id:'t2', name:'Series A', amt:0, when:'g3'} ],

  eng:{ target:1.75, ramp:{on:true, r1:0.33, r2:0.75, m2:4, m3:9},
        mix:{property:60, financial:25, family:15},
        land:{property:2, financial:40, family:2}, ceil:{property:5, financial:80, family:4},
        speed:3, c0:15, cmax:40, renew:95,
        disc:10, credit:2, implPct:20, implBasis:'list', implFloor:0, varPct:8, cac:2000,
        channelShare:50, advisorPct:12.5 },
  cap:{ quota:600000, ramp:6, founderSeller:0.5, onboardHrs:80, ongoingHrs:10, csCapacity:130, agentOn:true, agentCut:40 },
  gates:[
    { id:'g0', name:'Founder-led', met:true, kind:'families', thr:1, lag:0, criteria:[{t:'First paying customer live', done:true},{t:'Fractional CS leader engaged', done:false}] },
    { id:'g1', name:'Repeatable onboarding', met:false, kind:'families', thr:3, lag:1, criteria:[{t:'3 live, referenceable accounts', done:false},{t:'Path to Value Level 1 reached in a predictable timeframe', done:false},{t:'First referral-sourced paid deal', done:false}] },
    { id:'g2', name:'Repeatable selling', met:false, kind:'families', thr:6, lag:1, criteria:[{t:'5 referenceable customers', done:false},{t:'One channel producing qualified opportunities without Tim', done:false},{t:'Sales cycle and win rate measured', done:false}] },
    { id:'g3', name:'Series A', met:false, kind:'arr', thr:1500000, lag:0, criteria:[{t:'$1M to $3M ARR with sustained growth', done:false},{t:'One institutional vetting cleared', done:false},{t:'Series A closed', done:false}] }
  ],
  spend:[
    {id:'s1', bucket:'COGS', type:'Non-people', name:'Hosting and infrastructure, fixed base', hc:0, monthly:0, status:'Needs input', endGate:''},
    {id:'s2', bucket:'COGS', type:'Non-people', name:'Third-party data and services', hc:0, monthly:0, status:'Needs input', endGate:''},
    {id:'s3', bucket:'Customer success', type:'People', name:'Customer Success team', hc:3, monthly:0, status:'Needs input', endGate:''},
    {id:'s4', bucket:'R&D', type:'People', name:'Product and engineering team', hc:0, monthly:0, status:'Needs input', endGate:''},
    {id:'s5', bucket:'R&D', type:'Contingent', name:'Development contractors', hc:0, monthly:0, status:'Needs input', endGate:''},
    {id:'s6', bucket:'R&D', type:'Non-people', name:'R&D tools and services', hc:0, monthly:0, status:'Needs input', endGate:''},
    {id:'s7', bucket:'Sales & marketing', type:'People', name:'GTM team, employees', hc:1, monthly:0, status:'Needs input', endGate:''},
    {id:'s8', bucket:'Sales & marketing', type:'Contingent', name:'GTM fractional and contractors', hc:1.5, monthly:25000, status:'Needs input', endGate:''},
    {id:'s9', bucket:'Sales & marketing', type:'Non-people', name:'GTM tools and data', hc:0, monthly:1000, status:'Needs input', endGate:''},
    {id:'s10', bucket:'Sales & marketing', type:'Non-people', name:'Travel and events', hc:0, monthly:0, status:'Needs input', endGate:''},
    {id:'s11', bucket:'G&A', type:'People', name:'Executive and G&A team', hc:0, monthly:0, status:'Needs input', endGate:''},
    {id:'s12', bucket:'G&A', type:'Contingent', name:'G&A contractors and advisors', hc:0, monthly:0, status:'Needs input', endGate:''},
    {id:'s13', bucket:'G&A', type:'Non-people', name:'Legal', hc:0, monthly:0, status:'Needs input', endGate:''},
    {id:'s14', bucket:'G&A', type:'Non-people', name:'Accounting, tax and audit', hc:0, monthly:0, status:'Needs input', endGate:''},
    {id:'s15', bucket:'G&A', type:'Non-people', name:'Insurance', hc:0, monthly:0, status:'Needs input', endGate:''},
    {id:'s16', bucket:'G&A', type:'Non-people', name:'Security and compliance', hc:0, monthly:0, status:'Needs input', endGate:''},

    {id:'s19', bucket:'G&A', type:'Non-people', name:'Other G&A', hc:0, monthly:0, status:'Needs input', endGate:''}
  ],
  spendCfg:{ burden:20, raise:4, contingency:5 },
  oneTime:[ {id:'o1', name:'Legal and fees on each raise', amt:0, when:'g3'}, {id:'o2', name:'Bonuses due on Series A close', amt:0, when:'g3'} ],
  roles:[
    {id:'r1', name:'Fractional CS leader', type:'Fractional', gate:'g0', offset:1, count:1, monthly:12000, bucket:'Customer success', seller:false, endGate:'g1'},
    {id:'r2', name:'Head of Customer Success', type:'FTE', gate:'g1', offset:0, count:1, monthly:20000, bucket:'Customer success', seller:false, endGate:''},

    {id:'r5', name:'Marketing lead', type:'FTE', gate:'g2', offset:1, count:1, monthly:18000, bucket:'Sales & marketing', seller:false, endGate:''},
    {id:'r6', name:'Customer success manager', type:'FTE', gate:'g2', offset:2, count:1, monthly:13000, bucket:'Customer success', seller:false, endGate:''},
    {id:'r7', name:'Account executives', type:'FTE', gate:'g3', offset:1, count:2, monthly:22000, bucket:'Sales & marketing', seller:true, endGate:''},
    {id:'r8', name:'SDR', type:'FTE', gate:'g3', offset:1, count:1, monthly:10000, bucket:'Sales & marketing', seller:false, endGate:''},
    {id:'r9', name:'Customer success managers', type:'FTE', gate:'g3', offset:2, count:2, monthly:13000, bucket:'Customer success', seller:false, endGate:''},
    {id:'r10', name:'Revenue operations', type:'FTE', gate:'g3', offset:2, count:1, monthly:15000, bucket:'Sales & marketing', seller:false, endGate:''},
    {id:'r11', name:'Institutional partner manager', type:'FTE', gate:'g3', offset:3, count:1, monthly:18000, bucket:'Sales & marketing', seller:false, endGate:''}
  ],
  programs:[
    {id:'p1', name:'Content and thought leadership', gate:'g1', offset:0, monthly:4000},
    {id:'p2', name:'Family office salons and breakfasts', gate:'g1', offset:1, monthly:5000},
    {id:'p3', name:'Conferences and sponsorships', gate:'g2', offset:0, monthly:8000},
    {id:'p4', name:'LinkedIn and paid social', gate:'g2', offset:1, monthly:6000},
    {id:'p5', name:'Demand programs', gate:'g3', offset:1, monthly:20000},
    {id:'p6', name:'Brand and PR', gate:'g3', offset:2, monthly:8000}
  ],
  pf:{ financial:98, property:3, family:2, disc:20 },
  baseline:null, actuals:{}
};

const clone = o => JSON.parse(JSON.stringify(o));
function migrate(s){
  const d = clone(DEFAULT); if (!s || typeof s !== 'object') return d;
  if (s.version !== 2){ ['spend','roles','programs'].forEach(k => { if (Array.isArray(s[k])) d[k] = s[k]; }); if (s.cash) d.cash = s.cash; return d; }
  const o = Object.assign(d, s);
  o.eng = Object.assign(clone(DEFAULT.eng), s.eng || {}); o.eng.ramp = Object.assign(clone(DEFAULT.eng.ramp), (s.eng || {}).ramp || {});
  ['mix','land','ceil'].forEach(k => o.eng[k] = Object.assign(clone(DEFAULT.eng[k]), (s.eng || {})[k] || {}));
  o.cap = Object.assign(clone(DEFAULT.cap), s.cap || {}); o.pf = Object.assign(clone(DEFAULT.pf), s.pf || {});
  o.actuals = s.actuals || {};
  if (!s.implStd){ o.eng.implBasis = 'list'; o.implStd = true; }
  if (!s.spendBroad){ o.spend = clone(DEFAULT.spend); o.spendBroad = true; }
  o.spendCfg = Object.assign(clone(DEFAULT.spendCfg), s.spendCfg || {}); if (!Array.isArray(s.oneTime)) o.oneTime = clone(DEFAULT.oneTime);
  return o;
}
let state = clone(DEFAULT);
try { const s = localStorage.getItem('eleven-gtm-model-v2'); if (s) state = migrate(JSON.parse(s)); } catch (e) {}

/* ===== helpers ===== */
let uid = 1; const nid = p => p + Date.now().toString(36) + (uid++);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };

function parseAmt(str){ const t = String(str).trim().toUpperCase().replace(/[$,\s]/g, ''); const m = t.match(/^(-?\d*\.?\d+)([KM]?)$/); if (!m) return null; return Math.round(parseFloat(m[1]) * (m[2] === 'M' ? 1e6 : m[2] === 'K' ? 1e3 : 1)); }
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function ymOf(i){ const [y0,m0] = state.startMonth.split('-').map(Number); const t = (m0-1) + i; return [y0 + Math.floor(t/12), ((t%12)+12)%12]; }
const mLabel = i => { const [y,m] = ymOf(i); return MN[m] + ' ' + String(y).slice(2); };
const mLong = i => { const [y,m] = ymOf(i); return MN[m] + ' ' + y; };
const mISO = i => { const [y,m] = ymOf(i); return y + '-' + String(m+1).padStart(2,'0'); };
function mIdx(ym){ if (!ym) return Infinity; const [y,m] = ym.split('-').map(Number); const [y0,m0] = state.startMonth.split('-').map(Number); return (y-y0)*12 + (m-m0); }
const gateById = id => state.gates.find(g => g.id === id);
const gNum = id => state.gates.findIndex(g => g.id === id);

/* ===== engine ===== */
function model(){
  const e = state.eng, H = state.horizon, H2 = H + 12, k = SPEED_K[e.speed] || 0.2;
  const mixT = MODS.reduce((s, m) => s + num(e.mix[m]), 0) || 1;
  const disc = num(e.disc)/100, c0 = num(e.c0)/100, cmax = Math.max(c0, num(e.cmax)/100), renew = num(e.renew)/100;
  const pct = num(e.implPct)/100, floor = num(e.implFloor), credit = Math.min(12, num(e.credit));
  const vol = (m, t) => { const l = Math.max(0, num(e.land[m])), c = Math.max(num(e.ceil[m]), l); if (!l) return 0; const A = (c-l)/l; return c/(1 + A*Math.exp(-k*t)); };
  const xs = t => t < 3 ? 0 : Math.min(cmax, c0 + (cmax - c0)*(t - 3)/12);
  const per = [], list = [], surv = [];
  for (let t = 0; t < H2; t++){
    let lst = 0;
    MODS.forEach(L => { const w = num(e.mix[L])/mixT; if (!w) return; MODS.forEach(m => { lst += w * (m === L ? 1 : xs(t)) * tierPrice(m, vol(m, t)); }); });
    surv.push(Math.pow(renew, Math.floor(t/12))); list.push(lst * surv[t]); per.push(lst * (1 - disc) * surv[t]);
  }
  const base = t => e.implBasis === 'list' ? list[t] : per[t];
  const sign = []; for (let i = 0; i < H2; i++){ const M = i + 1; const r = e.ramp; sign.push(!r.on ? num(e.target) : M >= r.m3 ? num(e.target) : M >= r.m2 ? num(r.r2) : num(r.r1)); }
  const fam = [], arr = [], coll = [], impl = [], adv = [], newArr = [];
  for (let i = 0; i < H2; i++){
    let f = 0, a = 0, c = 0, im = 0;
    for (let m = 0; m <= i; m++){ const n = sign[m]; if (!n) continue; const age = i - m;
      f += n * surv[age]; a += n * per[age];
      if (age === 0){ c += n * per[0] * (1 - credit/12); im += n * Math.max(floor, pct * base(0)); }
      else { if (age % 12 === 0) c += n * per[age]; else c += n * Math.max(0, per[age] - per[age-1]) * (12 - age % 12)/12;
             im += n * pct * Math.max(0, base(age) - base(age-1)); } }
    state.existing.forEach(x => { const r = mIdx(x.renew); const passed = i >= r ? Math.floor((i - r)/12) + 1 : 0; const sv = Math.pow(renew, passed);
      f += sv; a += num(x.arr) * sv; if (i >= r && (i - r) % 12 === 0) c += num(x.arr) * sv; });
    fam.push(f); arr.push(a); coll.push(c + im); impl.push(im);
    adv.push(sign[i] * per[0] * num(e.channelShare)/100 * num(e.advisorPct)/100);
    newArr.push(sign[i] * per[0]);
  }
  /* gates fire on milestones from the engine */
  const gi = {};
  state.gates.forEach(g => { if (g.met){ gi[g.id] = 0; return; } const s = g.kind === 'arr' ? arr : fam; let hit = Infinity;
    for (let i = 0; i < H2; i++) if (s[i] >= num(g.thr) - 1e-9){ hit = i + num(g.lag); break; } gi[g.id] = hit; });
  const when = w => { if (String(w).startsWith('g')) return gi[w] ?? Infinity; const n = parseInt(w, 10); return isFinite(n) ? n - 1 : Infinity; };
  /* spend */
  const z = () => new Array(H).fill(0); const lines = [];
  const hcAll = z(), hcGTM = z(), csFTE = z(), sellers = z();
  const gtm = b => b === 'Sales & marketing' || b === 'Customer success';
  const sc = state.spendCfg || {}, bur = num(sc.burden)/100, rse = num(sc.raise)/100;
  state.spend.forEach(s => { const v = z(); const end = s.endGate ? gi[s.endGate] ?? Infinity : Infinity; const mult = s.type === 'People' ? 1 + bur : 1;
    for (let i = 0; i < H; i++) if (i < end){ v[i] = num(s.monthly) * mult * (s.type === 'Non-people' ? 1 : Math.pow(1 + rse, Math.floor(i/12))); hcAll[i] += num(s.hc); if (gtm(s.bucket)) hcGTM[i] += num(s.hc); if (s.bucket === 'Customer success') csFTE[i] += num(s.hc); }
    lines.push({bucket:s.bucket, name:s.name, kind:'Current', vals:v}); });
  state.roles.forEach(r => { const v = z(); const st = (gi[r.gate] ?? Infinity) + num(r.offset); const end = r.endGate ? gi[r.endGate] ?? Infinity : Infinity; const fte = (r.type === 'Fractional' ? 0.5 : 1) * num(r.count);
    for (let i = 0; i < H; i++) if (i >= st && i < end){ v[i] = num(r.monthly) * num(r.count); hcAll[i] += fte; if (gtm(r.bucket)) hcGTM[i] += fte; if (r.bucket === 'Customer success') csFTE[i] += fte;
      if (r.seller) sellers[i] += num(r.count) * Math.min(1, (i - st + 1)/Math.max(1, num(state.cap.ramp))); }
    lines.push({bucket:r.bucket, name:r.name + (num(r.count) > 1 ? ' (' + num(r.count) + ')' : ''), kind:'New hire', vals:v, start:st}); });
  const progV = z();
  state.programs.forEach(p => { const v = z(); const st = (gi[p.gate] ?? Infinity) + num(p.offset); for (let i = 0; i < H; i++) if (i >= st){ v[i] = num(p.monthly); progV[i] += v[i]; }
    lines.push({bucket:'Sales & marketing', name:p.name, kind:'Program', vals:v}); });
  lines.push({bucket:'Sales & marketing', name:'Advisor and referral commissions', kind:'Variable', vals:adv.slice(0, H)});
  lines.push({bucket:'Sales & marketing', name:'Sales cost per new family', kind:'Variable', vals:sign.slice(0, H).map(n => n * num(e.cac))});
  lines.push({bucket:'COGS', name:'Variable delivery cost (hosting, AI, connectors)', kind:'Variable', vals:arr.slice(0, H).map(a => a/12 * num(e.varPct)/100)});
  (state.oneTime || []).forEach(o => { const v = z(); const i = when(o.when); if (i >= 0 && i < H) v[i] = num(o.amt); lines.push({bucket:'G&A', name:o.name, kind:'One-time', vals:v}); });
  const pre = z(); lines.forEach(l => l.vals.forEach((v, i) => pre[i] += v));
  lines.push({bucket:'G&A', name:'Contingency', kind:'Contingency', vals:pre.map(v => v * num(sc.contingency)/100)});
  const byB = {}; BUCKETS.forEach(b => byB[b] = z()); const smPeople = z(), mkt = z();
  lines.forEach(l => l.vals.forEach((v, i) => { byB[l.bucket][i] += v; if (l.bucket === 'Sales & marketing'){ if (l.kind === 'Program' || l.name.startsWith('Advisor')) mkt[i] += v; else smPeople[i] += v; } }));
  const spend = z().map((_, i) => BUCKETS.reduce((s, b) => s + byB[b][i], 0));
  const raise = z(); state.raises.forEach(t => { const i = when(t.when); if (i >= 0 && i < H) raise[i] += num(t.amt); });
  const net = [], cash = [], cum = []; let bal = num(state.cash), c2 = 0;
  for (let i = 0; i < H; i++){ const n = coll[i] - spend[i]; net.push(n); c2 += n; cum.push(c2); bal += n + raise[i]; cash.push(bal); }
  let payg = -1; for (let i = 0; i < H; i++){ if (net[i] >= 0 && net.slice(i).every(v => v >= 0)){ payg = i; break; } }
  let trough = 0; for (let i = 1; i < H; i++) if (cum[i] < cum[trough]) trough = i;
  let low = 0; for (let i = 1; i < H; i++) if (cash[i] < cash[low]) low = i;
  let out = -1; for (let i = 0; i < H; i++) if (cash[i] < 0){ out = i; break; }
  const cust = fam; const ca = state.cap;
  const csReq = z().map((_, i) => (sign[i] * num(ca.onboardHrs) * (ca.agentOn ? 1 - num(ca.agentCut)/100 : 1) + fam[i] * num(ca.ongoingHrs)) / Math.max(1, num(ca.csCapacity)));
  const sellReq = z().map((_, i) => newArr.slice(i, i + 12).reduce((s, v) => s + v, 0) / Math.max(1, num(ca.quota)));
  const sellPlan = sellers.map(s => s + num(ca.founderSeller));
  return {H, sign, fam, arr, coll, impl, per, list, spend, lines, byB, smPeople, mkt, progV, adv, raise, net, cash, cum, payg, bridge:Math.max(0, -cum[trough]), trough, low, out,
    gi, hcAll, hcGTM, csFTE, csReq, sellReq, sellPlan, cust, landACV: per[0], landList: list[0], when};
}

let dbRef = null, writing = false, pending = false, saveTimer = null, dirty = false;
function setSave(t){ const el = document.getElementById('saveNote'); if (el) el.textContent = t; }
function scheduleSave(){
  dirty = true;
  try { localStorage.setItem('eleven-gtm-model-v2', JSON.stringify(state)); } catch (e) {}
  if (!dbRef){ setSave('Saved on this device'); return; }
  setSave('Saving…'); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 800);
}
async function flush(){
  if (!dbRef) return; if (writing){ pending = true; return; }
  writing = true;
  try { await dbRef.set(clone(state)); setSave('Saved'); } catch (e) { setSave('Not synced, saved on this device'); }
  writing = false; if (pending){ pending = false; flush(); }
}
(async () => {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  try {
    const db = await window.claude.use('db'); if (!db) return;
    const ref = db.doc('plan/current');
    const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))]);
    dbRef = ref;
    if (snap.exists && !dirty){ state = migrate(snap.data()); renderAll(); setSave('Saved'); if (snap.data().version !== 2) flush(); }
    else if (dirty) flush(); else setSave('Saved');
  } catch (e) { setSave('Saved on this device'); }
})();

/* ===== charts ===== */
function chart(series, opts){
  const W = 860, H = opts.h || 270, L = 64, R = 12, T = 14, B = 28; const n = series[0].vals.length;
  const all = series.flatMap(s => s.vals);
  let lo = Math.min(0, ...all), hi = Math.max(1, ...all); const pad = (hi - lo) * 0.08; hi += pad; if (lo < 0) lo -= pad;
  const bw = (W - L - R) / n;
  const x = i => L + bw * (i + 0.5); const y = v => T + (H - T - B) * (1 - (v - lo)/(hi - lo));
  let g = '<g class="grid">';
  for (let k = 0; k <= 4; k++){ const v = lo + (hi - lo)*k/4; g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${opts.fmt(v)}</text>`; }
  g += '</g>';
  for (let i = 0; i < n; i += 3) g += `<text x="${x(i)}" y="${H-9}" text-anchor="middle">${mLabel(i)}</text>`;
  if (lo < 0) g += `<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
  (opts.marks || []).forEach(mk => { if (mk.i >= 0 && mk.i < n) g += `<line x1="${x(mk.i)}" x2="${x(mk.i)}" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="${x(mk.i)+4}" y="${T+10}" style="font-weight:700">${esc(mk.label)}</text>`; });
  series.filter(s => s.type === 'bar').forEach(s => s.vals.forEach((v, i) => { const y0 = y(0), y1 = y(v);
    g += `<rect x="${x(i) - bw*0.36}" width="${bw*0.72}" y="${Math.min(y0, y1)}" height="${Math.max(1, Math.abs(y1 - y0))}" fill="${v >= 0 ? s.color : s.neg}" opacity=".85"/>`; }));
  series.filter(s => s.type !== 'bar').forEach(s => { g += `<polyline fill="none" stroke="${s.color}" stroke-width="2.4" ${s.dash ? 'stroke-dasharray="6 4"' : ''} points="${s.vals.map((v, i) => x(i) + ',' + y(v)).join(' ')}"/>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label)}">${g}</svg>
  <div class="legend">${series.map(s => `<span><i style="background:${s.color}${s.dash ? ';opacity:.7' : ''}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}

  <div class="chartblock"><h3>Monthly collections vs spend</h3><p>Bars show net cash each month. Annual prepay pulls each family’s year forward to signing, so collections arrive in steps at signings and anniversaries.</p><div id="ch-flow"></div></div>

function refresh(){

  document.getElementById('h-label').textContent = R.payg < 0 ? `Collections don’t cover spend within ${H} months at these settings. Low point ${mLong(R.low)}.` : `${mLong(R.payg)}: the month collections exceed spend and stay there. Low point ${mLong(R.low)}.`;

  const spendNow = R.spend[0];
  document.getElementById('stats').innerHTML = [
    [money(R.bridge), 'One-time bridge to reach pay-as-we-go, before raises'],
    [num(state.cash) === 0 && state.raises.every(t => !num(t.amt)) ? 'Enter cash' : R.out < 0 ? 'Funded through M' + H : 'Out of cash M' + (R.out + 1), 'Runway with capital raised'],
    [famP === null ? 'n/a' : famP.toFixed(1), 'Families on the platform at pay-as-we-go'],
    [money(R.arr[lastI]), `ARR at M${H}, ${R.fam[lastI].toFixed(0)} families`],

  ].map(([v, l]) => `<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
  document.getElementById('rail').innerHTML = state.gates.map((g, i) => { const gi = R.gi[g.id]; const on = gi < H;
    return `<li class="${g.met ? 'met' : on ? 'on' : ''}"><b>Gate ${i}: ${esc(g.name)}</b><span>${g.met ? 'Met' : on ? mName(gi) : 'Not reached in ' + H + ' months'}</span></li>`; }).join('');
  document.getElementById('ch-cash').innerHTML = chart([{name:'Cash balance', vals:R.cash, color:'var(--blue)'}, {name:'ARR', vals:R.arr.slice(0, H), color:'var(--greenl)', dash:true}], {fmt:money, label:'Cash balance and ARR by month', marks:gateMarks(R)});
  document.getElementById('ch-flow').innerHTML = chart([{name:'Net cash', vals:R.net, color:'var(--greenl)', neg:'var(--red)', type:'bar'}, {name:'Collections', vals:R.coll.slice(0, H), color:'var(--blue)'}, {name:'Spend', vals:R.spend, color:'var(--amber-line)'}], {fmt:money, label:'Monthly collections, spend and net cash', h:240});
  const sustain = R.spend.map((s, i) => { const apf = R.fam[i] > 0 ? R.arr[i]/R.fam[i] : R.landACV; return apf > 0 ? s / (apf/12) : 0; });
  document.getElementById('ch-fam').innerHTML = chart([{name:'Families on the platform', vals:R.fam.slice(0, H), color:'var(--blue)'}, {name:'Sustain target', vals:sustain, color:'var(--muted)', dash:true}], {fmt:v => v.toFixed(0), label:'Families on the platform with the sustain target', marks:gateMarks(R)});
  const d = document.querySelector('[data-out="derived"]');
  if (d) d.innerHTML = `Landing ACV per new family: <b>${money(R.landACV)}</b> net (${money(R.landList)} list). Cash at signing: <b>${money(R.landACV * (1 - num(state.eng.credit)/12) + Math.max(num(state.eng.implFloor), num(state.eng.implPct)/100 * (state.eng.implBasis === 'list' ? R.landList : R.landACV)))}</b>, a year prepaid less the credit, plus implementation. ACV at month 24: <b>${money(R.per[23] / Math.pow(num(state.eng.renew)/100, 1) || 0)}</b>.`;
  document.querySelectorAll('output[data-for]').forEach(o => { o.textContent = FMT[o.dataset.fmt](getPath(o.dataset.for)); });
  document.querySelectorAll('#view [data-out]').forEach(el => { const f = OUT[el.dataset.out]; if (f) el.innerHTML = f(R); });
  document.querySelectorAll('#presets button[data-preset]').forEach(b => b.classList.toggle('active', b.dataset.preset === state.preset));
}

V.plan = () => `<h2 class="sec">Operating plan</h2>
  <p class="lead">Monthly schedule by bucket at the current settings. The CSV carries every line item plus these totals, so it drops into the operating plan.</p>
  <div class="panel"><div class="scroll plan" data-out="planTable"></div>
  <div class="btns"><button data-act="csv">Download operating plan CSV</button><button class="ghost" data-act="backup">Download backup</button><button class="ghost" data-act="restore">Restore from backup</button><button class="ghost" data-act="reset">Reset to starting values</button></div></div>`;
OUT.planTable = R => `<table><thead><tr><th>Line</th>${R.spend.map((_, i) => `<th class="num">M${i+1}<br>${mLabel(i)}</th>`).join('')}</tr></thead><tbody>
  ${planRows(R).map(([n, v, t]) => `<tr class="${t === 'tot' ? 'tot' : ''}"><td>${n}</td>${v.map(x => `<td class="num ${t !== 'n' && x < -0.5 ? 'gap' : ''}">${t === 'n' ? x.toFixed(1) : money(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
function csv(){
  const R = model(); const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const rows = [['Bucket','Line','Type', ...R.spend.map((_, i) => mISO(i))].map(q).join(',')];
  R.lines.forEach(l => rows.push([l.bucket, l.name, l.kind, ...l.vals.map(v => Math.round(v))].map(q).join(',')));
  rows.push('');
  planRows(R).forEach(([n, v, t]) => rows.push(['Summary', n, '', ...v.map(x => t === 'n' ? x.toFixed(2) : Math.round(x))].map(q).join(',')));
  return rows.join('\n');
}

/* track against plan */
function todayIdx(){ const d = new Date(); return (d.getFullYear() - +state.startMonth.slice(0, 4)) * 12 + (d.getMonth() + 1 - +state.startMonth.slice(5, 7)); }
V.track = () => `<h2 class="sec">Track against plan</h2>
  <p class="lead">Lock the current settings as the baseline. Each month, enter the families signed, ARR and cash at month end. The table tallies running counts and shows how far ahead or behind plan you are.</p>
  <div class="btns" style="margin:0 0 14px"><button data-act="lock">${state.baseline ? 'Re-lock this plan' : 'Lock this plan'}</button><button class="ghost" data-act="trackCsv" ${state.baseline ? '' : 'disabled'}>Export CSV</button><button class="ghost" data-act="clearActuals" ${state.baseline ? '' : 'disabled'}>Clear actuals</button></div>
  ${state.baseline ? `<p class="sm">Baseline locked ${esc(state.baseline.at)} from the ${esc(state.baseline.preset || 'custom')} settings. Changing inputs afterward never moves it.</p>
  <div class="panel"><div class="scroll track" data-out="trackTable"></div></div>` : `<div class="callout">No plan locked yet. Set the inputs to the committed plan, then lock it.</div>`}`;
function trackRows(){ const b = state.baseline; if (!b) return []; const last = Object.keys(state.actuals).map(Number).filter(k => { const a = state.actuals[k]; return a && (a.nf !== '' || a.arr !== '' || a.cash !== ''); });
  const n = Math.min(b.fam.length, Math.max(3, todayIdx() + 2, ...last.map(k => k + 2)));
  let cum = b.fam0; const out = [];
  for (let i = 0; i < n; i++){ const a = state.actuals[i] || {}; const has = a.nf !== undefined && a.nf !== ''; if (has) cum += num(a.nf);
    out.push({i, planFam:b.fam[i], nf:a.nf ?? '', actFam: has ? cum : null, planArr:b.arr[i], arr:a.arr ?? '', planCash:b.cash[i], cash:a.cash ?? ''}); }
  return out; }
OUT.trackTable = () => { const rows = trackRows(); const dv = (a, p, f) => a === '' || a === null ? '' : `<span class="${a - p >= 0 ? 'okv' : 'gap'}">${a - p >= 0 ? '+' : ''}${f(a - p)}</span>`;
  return `<table><thead><tr><th>Month</th><th class="num">Families, plan</th><th class="num">New families, actual</th><th class="num">Families, actual</th><th class="num">vs plan</th><th class="num">ARR, plan</th><th class="num">ARR, actual</th><th class="num">vs plan</th><th class="num">Cash, plan</th><th class="num">Cash, actual</th><th class="num">vs plan</th></tr></thead><tbody>
  ${rows.map(r => `<tr><td>M${r.i+1}, ${mLabel(r.i)}</td><td class="num">${r.planFam.toFixed(1)}</td>
    <td class="num"><input type="number" step="1" min="0" data-act-in="nf" data-i="${r.i}" value="${esc(r.nf)}" aria-label="New families signed, actual"></td>
    <td class="num">${r.actFam === null ? '' : r.actFam.toFixed(0)}</td><td class="num">${dv(r.actFam, r.planFam, v => v.toFixed(1))}</td>
    <td class="num">${money(r.planArr)}</td><td class="num"><input type="text" inputmode="numeric" data-act-in="arr" data-i="${r.i}" value="${r.arr === '' ? '' : full(num(r.arr))}" aria-label="ARR, actual"></td><td class="num">${dv(r.arr === '' ? '' : num(r.arr), r.planArr, money)}</td>
    <td class="num">${money(r.planCash)}</td><td class="num"><input type="text" inputmode="numeric" data-act-in="cash" data-i="${r.i}" value="${r.cash === '' ? '' : full(num(r.cash))}" aria-label="Cash, actual"></td><td class="num">${dv(r.cash === '' ? '' : num(r.cash), r.planCash, money)}</td></tr>`).join('')}</tbody></table>`; };

/* ===== events ===== */
document.getElementById('presets').innerHTML = Object.entries(PRESETS).map(([k, p]) => `<button data-preset="${k}">${p.label}</button>`).join('') + '<span class="save"></span>';
document.getElementById('presets').addEventListener('click', e => { const b = e.target.closest('button[data-preset]'); if (!b) return; const p = PRESETS[b.dataset.preset];
  Object.assign(state.eng, {target:p.target, ramp:clone(p.ramp), speed:p.speed, c0:p.c0, cmax:p.cmax, renew:p.renew, disc:p.disc}); state.preset = b.dataset.preset; scheduleSave(); renderAll(); });
function onField(e){
  const t = e.target;
  if (t.dataset && t.dataset.actIn){ if (e.type === 'input' && t.type !== 'number') return; const i = t.dataset.i; const a = state.actuals[i] = state.actuals[i] || {nf:'', arr:'', cash:''};
    if (t.dataset.actIn === 'nf') a.nf = t.value; else { const v = t.value.trim() === '' ? '' : parseAmt(t.value); if (v === null) return; a[t.dataset.actIn] = v; }
    scheduleSave(); if (e.type === 'change'){ const el = document.querySelector('[data-out="trackTable"]'); if (el) el.innerHTML = OUT.trackTable(); } return; }
  if (!t.dataset || !t.dataset.k) return;
  if (e.type === 'input' && (t.type === 'checkbox' || t.tagName === 'SELECT' || t.type === 'month')) return;
  let val;
  if (t.type === 'checkbox') val = t.checked;
  else if (t.hasAttribute('data-amt')){ const v = parseAmt(t.value); if (v === null) return; val = v; if (e.type === 'change') t.value = full(v); }
  else if (t.hasAttribute('data-num')) val = num(t.value);
  else val = t.value;
  if (t.type === 'month' && !val) return;
  if (t.dataset.k === 'eng.ramp.m2' || t.dataset.k === 'eng.ramp.m3') val = num(val);
  setPath(t.dataset.k, val);
  if (t.dataset.k.startsWith('eng.') && ['eng.target','eng.ramp','eng.speed','eng.c0','eng.cmax','eng.renew','eng.disc'].some(p => t.dataset.k.startsWith(p))) state.preset = '';
  if (t.dataset.k === 'eng.ramp.m2' && num(state.eng.ramp.m3) <= num(val)) state.eng.ramp.m3 = Math.min(state.horizon, num(val) + 1);
  scheduleSave();
  const structural = e.type === 'change' && (t.hasAttribute('data-full') || (t.tagName === 'SELECT' && t.closest('#view') && current() !== 'spend' && current() !== 'plan'));
  if (structural) renderAll(); else refresh();
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
  if (a === 'del') state[b.dataset.list].splice(+b.dataset.i, 1);
  else if (a === 'addRaise') state.raises.push({id:nid('t'), name:'Raise ' + (state.raises.length + 1), amt:500000, when:'13'});
  else if (a === 'addExisting') state.existing.push({id:nid('e'), name:'New customer', arr:25000, renew:mISO(11)});
  else if (a === 'addSpend') state.spend.push({id:nid('s'), bucket:'G&A', type:'Non-people', name:'New line', hc:0, monthly:0, status:'Needs input', endGate:''});
  else if (a === 'addOneTime') state.oneTime.push({id:nid('o'), name:'New item', amt:0, when:'1'});
  else if (a === 'addRole') state.roles.push({id:nid('r'), name:'New role', type:'FTE', gate:'g2', offset:0, count:1, monthly:15000, bucket:'Sales & marketing', seller:false, endGate:''});
  else if (a === 'addProgram') state.programs.push({id:nid('p'), name:'New program', gate:'g1', offset:0, monthly:0});
  else if (a === 'addCrit') state.gates[+b.dataset.g].criteria.push({t:'', done:false});
  else if (a === 'delCrit') state.gates[+b.dataset.g].criteria.splice(+b.dataset.c, 1);
  else if (a === 'rafferty') state.pf = clone(DEFAULT.pf);
  else if (a === 'lock'){ if (state.baseline && !confirm('Replace the locked baseline with the current settings? Actuals you entered stay.')) return;
    const R = model(); state.baseline = {at:new Date().toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}), preset:(PRESETS[state.preset] || {}).label || 'custom',
      fam:R.fam.slice(0, R.H).map(v => +v.toFixed(3)), arr:R.arr.slice(0, R.H).map(Math.round), cash:R.cash.map(Math.round), fam0:state.existing.length}; }
  else if (a === 'clearActuals'){ if (!confirm('Clear every actual you entered?')) return; state.actuals = {}; }
  else if (a === 'trackCsv'){ const q = s => '"' + String(s).replace(/"/g, '""') + '"'; const rows = [['Month','Families plan','New families actual','Families actual','ARR plan','ARR actual','Cash plan','Cash actual'].map(q).join(',')];
    trackRows().forEach(r => rows.push([mISO(r.i), r.planFam.toFixed(2), r.nf, r.actFam ?? '', r.planArr, r.arr, r.planCash, r.cash].map(q).join(','))); offerFile('eleven-track-against-plan.csv', rows.join('\n')); return; }
  else if (a === 'csv'){ offerFile('eleven-operating-plan.csv', csv()); return; }
  else if (a === 'backup'){ offerFile('eleven-gtm-model-backup.json', JSON.stringify(state, null, 2)); return; }
  else if (a === 'restore'){ document.getElementById('restoreFile').click(); return; }
  else if (a === 'reset'){ if (!confirm('Reset every input to the starting values? Download a backup first if you want to keep this version.')) return; state = clone(DEFAULT); }
  else return;
  scheduleSave(); renderAll();
});
document.getElementById('restoreFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { state = migrate(JSON.parse(await f.text())); scheduleSave(); renderAll(); }
  catch (err) { alert('That file isn’t a backup from this model. Choose the JSON file from “Download backup”.'); }
  e.target.value = '';
});
window.addEventListener('hashchange', () => { renderMain(); refresh(); });
renderAll();

</script>
</body>
</html>
