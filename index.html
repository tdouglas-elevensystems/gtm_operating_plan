<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eleven | GTM operating model</title>
<style>
:root{
  color-scheme:dark;--bg:#000000;--surface:#121212;--aside:#0A0A0A;--ink:#FFFFFF;--muted:#B3B3B3;--navy:#000000;--blue:#6DCFF6;--btn:#1175B6;--light:#1175B6;
  --row:#181818;--line:#2A2A2A;--th:#353535;--amber-bg:#24180B;--amber:#EE9D4E;--amber-line:#EE9D4E;
  --green-bg:#0B2215;--green:#1ED760;--greenl:#1ED760;--red:#F15E6C;--head-muted:#B3B3B3;--chip:#353535;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#000000;--surface:#121212;--aside:#0A0A0A;--ink:#FFFFFF;--muted:#B3B3B3;--navy:#000000;--blue:#6DCFF6;--btn:#1175B6;--light:#1175B6;
  --row:#181818;--line:#2A2A2A;--th:#353535;--amber-bg:#24180B;--amber:#EE9D4E;--amber-line:#EE9D4E;
  --green-bg:#0B2215;--green:#1ED760;--greenl:#1ED760;--red:#F15E6C;--head-muted:#B3B3B3;--chip:#353535;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#000000;--surface:#121212;--aside:#0A0A0A;--ink:#FFFFFF;--muted:#B3B3B3;--navy:#000000;--blue:#6DCFF6;--btn:#1175B6;--light:#1175B6;
  --row:#181818;--line:#2A2A2A;--th:#353535;--amber-bg:#24180B;--amber:#EE9D4E;--amber-line:#EE9D4E;
  --green-bg:#0B2215;--green:#1ED760;--greenl:#1ED760;--red:#F15E6C;--head-muted:#B3B3B3;--chip:#353535;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Arial,Helvetica,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
header.top{background:var(--navy);border-bottom:1px solid var(--line);color:#fff;padding:18px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
header h1{font-size:19px;margin:0;font-weight:700}
header .sub{font-size:13px;color:var(--head-muted);margin:2px 0 0}
.presets{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.presets button{font:13px Arial,sans-serif;padding:7px 14px;border-radius:16px;border:1px solid var(--th);background:transparent;color:#fff;cursor:pointer}
.presets button.active{background:var(--btn);border-color:var(--btn)}
.save{font-size:12.5px;color:var(--head-muted)}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:calc(100vh - 70px)}
aside{background:var(--aside);border-right:1px solid var(--line);padding:20px 20px 40px}
aside h2{font-size:13px;font-weight:700;color:var(--blue);margin:24px 0 10px}
aside h2:first-child{margin-top:0}
.ctl{margin-bottom:13px}
.ctl .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:3px}
.ctl label{font-size:13px}
output{font-size:13px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap}
.hint{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
input[type=range]{width:100%;accent-color:var(--btn)}
input:not([type=range]):not([type=checkbox]),select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:5px 7px;min-width:0;width:100%}
input[type=checkbox]{accent-color:var(--btn)}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{display:grid;grid-template-columns:1fr 64px 64px;gap:6px;align-items:center;font-size:12.5px}
.mini.h{color:var(--muted);font-size:11.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.derived{font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;line-height:1.55}
button{font:inherit;font-size:13.5px;cursor:pointer;border-radius:4px;padding:7px 12px;border:1px solid var(--btn);background:var(--btn);color:#fff}
button.ghost{background:transparent;color:var(--blue)}
button.x{background:transparent;border:none;color:var(--muted);padding:2px 6px;font-size:17px;line-height:1}
button.link{background:none;border:none;color:var(--blue);padding:0;font-size:13px;text-decoration:underline}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
main{padding:22px 26px 60px;min-width:0}
.headline{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.headline .big{font-size:44px;font-weight:700;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .headline .big{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .headline .big{color:var(--ink)}}
.headline .big.alt{color:var(--blue)}
.headline .vs{color:var(--muted);font-size:15px}
.hl-label{color:var(--muted);font-size:13.5px;margin:2px 0 16px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted);line-height:1.35}
.rail{list-style:none;margin:0 0 20px;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.rail li{position:relative;padding:14px 12px 0 0}
.rail li::before{content:"";position:absolute;left:0;right:0;top:4px;height:3px;background:var(--line)}
.rail li.on::before{background:var(--btn)}
.rail li::after{content:"";position:absolute;left:0;top:0;width:11px;height:11px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.rail li.on::after{border-color:var(--btn);background:var(--btn)}
.rail li.met::after{border-color:var(--greenl);background:var(--greenl)}
.rail b{display:block;font-size:14px}
.rail span{font-size:12.5px;color:var(--muted);display:block}
.chartblock{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:16px}
.chartblock h3{margin:0 0 2px;font-size:15.5px}
.chartblock p{margin:0 0 8px;color:var(--muted);font-size:13px;max-width:80ch}
svg.chart{width:100%;height:auto;display:block}
svg .grid line{stroke:var(--line)}
svg text{fill:var(--muted);font:11px Arial,Helvetica,sans-serif}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:26px 0 18px}
nav.tabs a{padding:10px 12px;color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:3px solid transparent;font-size:14px}
nav.tabs a[aria-current="page"]{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
h2.sec{font-size:18px;margin:0 0 4px}
p.lead{margin:0 0 16px;color:var(--muted);max-width:75ch;font-size:13.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:16px}
.panel h3{font-size:15px;margin:0 0 8px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:700;color:#fff;background:var(--th);font-size:12px;padding:7px 6px;border-bottom:2px solid var(--th);white-space:nowrap}
td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even) td{background:var(--row)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td input.name{min-width:190px}
.callout{border-left:4px solid var(--amber-line);background:var(--amber-bg);color:var(--amber);padding:9px 13px;border-radius:4px;margin-bottom:14px;font-size:13.5px}
.callout.ok{border-left-color:var(--green);background:var(--green-bg);color:var(--green)}
.gates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.gate{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--btn);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.gate.met{border-top-color:var(--greenl)}
.gate .crit{display:flex;gap:6px;align-items:center}
.gate ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
.sm{font-size:12.5px;color:var(--muted)}
.gap{color:var(--red);font-weight:700}
.okv{color:var(--green);font-weight:700}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.plan td:first-child,.plan th:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:210px}
.plan th:first-child{background:var(--th)}
.plan tbody tr:nth-child(even) td:first-child{background:var(--row)}
.plan tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.track input{width:90px;text-align:right}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:min(720px,92vw);width:100%}
dialog textarea{width:100%;height:260px;font:12px/1.4 Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line)}
.foot{font-size:12px;color:var(--muted);margin-top:24px;max-width:90ch;line-height:1.55}
@media (max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.gates{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.layout{grid-template-columns:1fr}aside{border-right:none;border-bottom:1px solid var(--line)}main{padding:18px 16px 50px}.rail{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.gates{grid-template-columns:1fr}.headline .big{font-size:34px}header.top{padding:14px 16px}}


.capgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin:12px 0}
.capcol{border:1px solid var(--line);border-radius:6px;padding:10px 14px 4px;background:var(--surface)}
.capcol h4{margin:0 0 4px;font-size:14px;color:var(--blue)}
.caprow{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.caprow input:not([type=checkbox]){text-align:right;width:100%;min-width:0;max-width:100%;box-sizing:border-box}
.capin input:not([type=checkbox]){width:70px}
.capv{text-align:right;padding-right:8px}
.capin{display:flex;align-items:center;gap:4px}
.capcol .hint{margin:6px 0 8px}
.statgrid label{min-width:0}.statgrid input{width:100%;min-width:0}
details.chartblock summary{cursor:pointer;font-size:15.5px;list-style-position:inside}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:middle}
.dot.g{background:var(--green)}.dot.a{background:var(--amber)}.dot.r{background:var(--red)}
.dash td{vertical-align:top}
.dash td.cur input{width:110px;text-align:right;padding:3px 6px}
.dash tr.sechd td{background:transparent!important;color:var(--blue);font-weight:700;font-size:13px;padding-top:16px;border-bottom:1px solid var(--th)}
.dash td.note{color:var(--muted);font-size:12.5px;min-width:260px;max-width:420px;white-space:normal}
.dash td.bm{font-size:12.5px;min-width:180px;white-space:normal}
.dash td.mname{font-weight:700;white-space:nowrap}
.dash td.drv{font-style:italic}
.tna{color:var(--muted);font-size:12px}
.keyrow{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 0 12px;align-items:center}
.teamtab td input{width:96px;text-align:right;padding:3px 6px}
.ctlrow{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:13px}
.ctlrow select,.ctlrow input{width:auto}
</style>
</head>
<body>
<header class="top">
  <div><h1>Eleven | GTM operating model</h1><p class="sub">M1 = Jan 2027, when the strategic round closes. 48 months to Dec 2030. Hires and spend step up on milestones. Prepared by Tim Douglas.</p></div>
  <div class="presets" role="group" aria-label="Scenario presets" id="presets"></div>
</header>
<div class="layout">
  <aside id="aside" aria-label="Model inputs"></aside>
  <main id="main"></main>
</div>
<dialog id="copyDlg">
  <h3 id="copyTitle" style="margin-top:0">Copy file contents</h3>
  <p class="lead" style="margin-bottom:8px">Downloads aren’t available in this view. Copy the text below and paste it into a file.</p>
  <textarea id="copyText" readonly></textarea>
  <div class="btns"><button id="copyClose">Close</button></div>
</dialog>
<dialog id="confirmDlg">
  <p id="confirmText" style="margin-top:0"></p>
  <div class="btns"><button id="confirmYes">Yes</button><button class="ghost" id="confirmNo">Cancel</button></div>
</dialog>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>
<script>
/* ===== price book (Playbk), reference only ===== */
const MODS = ['property','financial','family'];
const MOD = {
  property:  { label:'Property',  unit:'properties', tiers:[[3,15000],[5,30000],[10,45000],[20,60000],[Infinity,80000]] },
  financial: { label:'Financial', unit:'entities',   tiers:[[50,25000],[100,40000],[200,70000],[400,100000],[Infinity,140000]] },
  family:    { label:'Family',    unit:'trusts',     tiers:[[5,15000],[10,25000],[Infinity,40000]] }
};
function tierOf(m, v){ const n = Math.max(1, Math.round(v)); const t = MOD[m].tiers; for (let i = 0; i < t.length; i++) if (n <= t[i][0]) return {tier:i+1, price:t[i][1]}; return {tier:t.length, price:t[t.length-1][1]}; }

/* ===== scenarios and starting values (GTM Stack and Cash Path workbook, Nov 2026) ===== */
const PRESETS = {
  cons: { label:'Conservative', blend:50000, renew:90, r1:0.5, r2:1, r3:2 },
  real: { label:'Realistic',    blend:60000, renew:95, r1:1,   r2:2, r3:3 },
  up:   { label:'Upside',       blend:70000, renew:97, r1:1.5, r2:3, r3:4 }
};
const FNS = ['Leadership','Customer success','Marketing','Sales and channels'];
const TEAM = ['CRO','Fractional leads','Head of CS, full time','CSMs','Marketers','AEs','SDR and partner manager'];
const ROLES = [
  {id:'cro',  fn:'Leadership', team:'CRO', name:'CRO base, sales and marketing share', monthly:26833, trig:{k:'always'}, note:'Two-thirds of $35K base plus 15% ($40,250 a month in all). Replaces today’s $25K retainer.'},
  {id:'crocs', fn:'Customer success', name:'CRO base, Customer Success share', monthly:13417, trig:{k:'always'}, note:'One-third of the CRO base: the CRO also runs CS. Same cash, reported where the work is.'},
  {id:'crov', fn:'Leadership', name:'CRO variable at plan', monthly:15000, trig:{k:'always'}, note:'$180K a year, earned on new ARR.'},
  {id:'cs0',  fn:'Customer success', name:'Existing CS team (Rayna, Cristina, Gabby)', monthly:26642, trig:{k:'always'}, note:'Today’s CS run rate. Confirm against actuals.'},
  {id:'hcsf', fn:'Customer success', team:'Fractional leads', name:'Head of CS, fractional', monthly:12000, trig:{k:'famLt', x:50}},
  {id:'hcs',  fn:'Customer success', team:'Head of CS, full time', name:'Head of CS, full time', monthly:22000, trig:{k:'famGe', x:50}},
  {id:'csm',  fn:'Customer success', team:'CSMs', name:'CSMs', monthly:13000, trig:{k:'perFam', x:20, per:20}, note:'Current team covers the first 20 families.'},
  {id:'mf',   fn:'Marketing', team:'Fractional leads', name:'Fractional marketing', monthly:10000, trig:{k:'arrLt', x:1500000}, note:'Placeholder fee. Confirm.'},
  {id:'mk1',  fn:'Marketing', team:'Marketers', name:'Full-time marketer', monthly:16000, trig:{k:'arrGe', x:1500000}},
  {id:'mk2',  fn:'Marketing', team:'Marketers', name:'Second marketer (demand gen)', monthly:14000, trig:{k:'arrGe', x:4000000}},
  {id:'prog', fn:'Marketing', name:'Programs and events', trig:{k:'pctNew', x:10}},
  {id:'s0',   fn:'Sales and channels', name:'Existing sales, marketing and tools', monthly:39312, trig:{k:'always'}, note:'Today’s S&M run rate less the CRO retainer and fractional marketing.'},
  {id:'ae1',  fn:'Sales and channels', team:'AEs', name:'Founding AE', monthly:26000, trig:{k:'signRun', x:2, run:2}},
  {id:'ae2',  fn:'Sales and channels', team:'AEs', name:'AE 2', monthly:26000, trig:{k:'signRun', x:3, run:6, after:'ae1'}, note:'Now after 6 months at 3 a month (was 1 month): partners and the CRO prove the pace first.'},
  {id:'ae3',  fn:'Sales and channels', team:'AEs', name:'AE 3', monthly:26000, trig:{k:'afterRole', after:'ae2', lag:3}},
  {id:'sdr',  fn:'Sales and channels', team:'SDR and partner manager', name:'SDR', monthly:9000, trig:{k:'afterRole', after:'ae3', lag:0}},
  {id:'pm',   fn:'Sales and channels', team:'SDR and partner manager', name:'Partner manager', monthly:18000, trig:{k:'fromMonth', x:13}, note:'Moved from month 9 to month 13. Placeholder for 5 active referral partners.'},
  {id:'ref',  fn:'Sales and channels', name:'Partner referral fees', trig:{k:'referral'}}
];
const CUR = { asOf:'Nov 2026', fam:1, arr:56000, sign:'', win:'', cycle:'', cover:'', partnerShare:100, partners:'', grr:'', golive:'', netNew:56000, cash:'',
  lead:25000, cs:26642, mkt:10000, sales:39312, rd:149966, cogs:23062, ga:37733 };
const TGT = { win:25, cycle:3, cover:3, partners:5 };
const DEFAULT = {
  version:4, preset:'real', startMonth:'2027-01', horizon:48,
  sc: Object.assign({}, PRESETS.real, {label:undefined}),
  inp: { expand:12, round:10000000, roundMo:1, otherCash:0, fam0:5, m2:7, m3:13, credit:2, implPct:20, implSign:50, golive:2, refShare:50, refFee:12.5, rd:149966, cogs:23062, ga:37733 },
  roles: JSON.parse(JSON.stringify(ROLES)),
  cur: Object.assign({}, CUR), tgt: Object.assign({}, TGT), checkpoint:11,
  pf:{ financial:98, property:3, family:12, disc:20 },
  baseline:null, actuals:{}
};
delete DEFAULT.sc.label; DEFAULT.v41 = true;
const clone = o => JSON.parse(JSON.stringify(o));
function migrate(s){
  const d = clone(DEFAULT); if (!s || typeof s !== 'object') return d;
  if (s.version !== 4){ if (s.pf) d.pf = Object.assign(d.pf, s.pf); d.parkedV3 = s; return d; }
  const o = Object.assign(d, s);
  o.sc = Object.assign(clone(DEFAULT.sc), s.sc || {}); o.inp = Object.assign(clone(DEFAULT.inp), s.inp || {});
  o.cur = Object.assign(clone(DEFAULT.cur), s.cur || {}); o.tgt = Object.assign(clone(DEFAULT.tgt), s.tgt || {});
  if (!Array.isArray(s.roles) || !s.v41){ o.roles = clone(ROLES); o.v41 = true; }
  o.actuals = s.actuals || {}; return o;
}
let state = clone(DEFAULT);
try { const s = localStorage.getItem('eleven-gtm-model-v4'); if (s) state = migrate(JSON.parse(s)); } catch (e) {}

/* ===== helpers ===== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const blank = v => v === '' || v === null || v === undefined || (typeof v === 'number' && !isFinite(v));
function money(v){ const a = Math.abs(v); const s = a >= 1e6 ? '$' + (a/1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M' : a >= 1e4 ? '$' + Math.round(a/1e3) + 'K' : '$' + Math.round(a).toLocaleString('en-US'); return (v < 0 ? '(' : '') + s + (v < 0 ? ')' : ''); }
const full = v => (v < 0 ? '(' : '') + '$' + Math.round(Math.abs(v)).toLocaleString('en-US') + (v < 0 ? ')' : '');
function parseAmt(str){ const t = String(str).trim().toUpperCase().replace(/[$,\s()]/g, ''); if (t === '') return ''; const m = t.match(/^(-?\d*\.?\d+)([KM]?)$/); if (!m) return null; return Math.round(parseFloat(m[1]) * (m[2] === 'M' ? 1e6 : m[2] === 'K' ? 1e3 : 1)); }
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function ymOf(i){ const [y0,m0] = state.startMonth.split('-').map(Number); const t = (m0-1) + i; return [y0 + Math.floor(t/12), ((t%12)+12)%12]; }
const mLabel = i => { const [y,m] = ymOf(i); return MN[m] + ' ' + String(y).slice(2); };
const mLong = i => { const [y,m] = ymOf(i); return MN[m] + ' ' + y; };
const mISO = i => { const [y,m] = ymOf(i); return y + '-' + String(m+1).padStart(2,'0'); };
const mName = i => 'M' + (i+1) + ', ' + mLong(i);
const sum = (a, f = 0, t = a.length - 1) => { let s = 0; for (let i = f; i <= t; i++) s += a[i] || 0; return s; };

/* ===== engine: mirrors the Monthly sheets of the GTM Stack and Cash Path workbook ===== */
function run(scIn){
  const sc = scIn || state.sc, I = state.inp, H = state.horizon, ren = num(sc.renew)/100, B = num(sc.blend), ex = 1 + num(I.expand)/100, q = 1 - (1 - ren)/12;
  const z = () => new Array(H).fill(0);
  const sign = z(), fam = z(), arr = z(), newArr = z(), impl = z(), coll = z(), rev = z(), yr = z();
  for (let i = 0; i < H; i++){ const M = i + 1; sign[i] = M < num(I.m2) ? num(sc.r1) : M < num(I.m3) ? num(sc.r2) : num(sc.r3);
    fam[i] = (i ? fam[i-1] : num(I.fam0)) * q + sign[i]; newArr[i] = sign[i]*B; yr[i] = Math.floor(i/12); }
  /* ARR by cohort: each family's ARR grows by the expansion rate at each anniversary */
  for (let i = 0; i < H; i++){ let a = num(I.fam0)*Math.pow(q, i + 1)*B*Math.pow(ex, yr[i]);
    for (let m = 0; m <= i; m++) a += sign[m]*Math.pow(q, i - m)*B*Math.pow(ex, Math.floor((i - m)/12)); arr[i] = a; }
  const pct = num(I.implPct)/100, atS = num(I.implSign)/100, lag = Math.round(num(I.golive)), credit = num(I.credit);
  for (let i = 0; i < H; i++){
    impl[i] = newArr[i]*pct*atS + (i >= lag ? newArr[i-lag]*pct*(1 - atS) : 0);
    let renew = 0; for (let k = 1; i - 12*k >= 0; k++) renew += sign[i-12*k]*B*Math.pow(ren*ex, k);
    const today = num(I.fam0)*B/12*Math.pow(ren*ex, yr[i]);
    coll[i] = newArr[i]*(1 - credit/12) + impl[i] + renew + today;
    rev[i] = arr[i]/12 + impl[i];
  }
  /* GTM roles fire on milestones */
  const rc = {}, rn = {}, start = {};
  state.roles.forEach(r => {
    const t = r.trig, c = z(), n = z(); let s0 = Infinity;
    if (t.k === 'signRun'){ for (let i = Math.max(1, num(t.run)); i < H; i++){ let ok = true; for (let j = 1; j <= num(t.run); j++) if (sign[i-j] < num(t.x)) ok = false;
        if (t.after && !(rn[t.after] && rn[t.after][i-1] > 0)) ok = false; if (ok){ s0 = i; break; } } }
    if (t.k === 'afterRole') s0 = (start[t.after] ?? Infinity) + num(t.lag);
    if (t.k === 'fromMonth') s0 = num(t.x) - 1;
    for (let i = 0; i < H; i++){ let k = 0;
      switch (t.k){
        case 'always': k = 1; break;
        case 'famLt': k = fam[i] < num(t.x) ? 1 : 0; break;
        case 'famGe': k = fam[i] >= num(t.x) ? 1 : 0; break;
        case 'arrLt': k = arr[i] < num(t.x) ? 1 : 0; break;
        case 'arrGe': k = arr[i] >= num(t.x) ? 1 : 0; break;
        case 'perFam': k = Math.ceil(Math.max(0, fam[i] - num(t.x))/Math.max(1, num(t.per)) - 1e-9); break;
        case 'signRun': case 'afterRole': case 'fromMonth': k = i >= s0 ? 1 : 0; break;
      }
      n[i] = k;
      c[i] = t.k === 'pctNew' ? newArr[i]*num(t.x)/100 : t.k === 'referral' ? newArr[i]*num(I.refShare)/100*num(I.refFee)/100 : k*num(r.monthly);
      if (k > 0 && start[r.id] === undefined) start[r.id] = i;
    }
    if (start[r.id] === undefined && (t.k === 'pctNew' || t.k === 'referral')) start[r.id] = 0;
    rc[r.id] = c; rn[r.id] = n;
  });
  const byFn = {}; FNS.forEach(f => byFn[f] = z());
  state.roles.forEach(r => rc[r.id].forEach((v, i) => byFn[r.fn][i] += v));
  const rd = z().fill(num(I.rd)), cogs = z().fill(num(I.cogs)), ga = z().fill(num(I.ga));
  const product = rd.map((v, i) => v + cogs[i]);
  const gtm = z().map((_, i) => FNS.reduce((s, f) => s + byFn[f][i], 0));
  const spend = z().map((_, i) => gtm[i] + product[i] + ga[i]);
  const raise = z(); const rm = Math.round(num(I.roundMo)) - 1; if (rm >= 0 && rm < H) raise[rm] = num(I.round);
  const net = z(), cash = z(); let bal = num(I.otherCash);
  for (let i = 0; i < H; i++){ net[i] = coll[i] - spend[i]; bal += net[i] + raise[i]; cash[i] = bal; }
  let payg = -1; for (let i = 0; i < H; i++){ if (net.slice(i).every(v => v >= 0)){ payg = i; break; } }
  let low = 0; for (let i = 1; i < H; i++) if (cash[i] < cash[low]) low = i;
  let out = -1; for (let i = 0; i < H; i++) if (cash[i] < 0){ out = i; break; }
  return {H, B, ren, ex, sign, fam, arr, newArr, impl, coll, rev, rc, rn, start, byFn, rd, cogs, ga, product, gtm, spend, raise, net, cash, payg, low, out};
}
const years = R => { const out = []; for (let y = 0; y*12 < R.H; y++) out.push({y, label:String(ymOf(y*12)[0]), f:y*12, t:Math.min(R.H, y*12 + 12) - 1}); return out; };

/* ===== persistence ===== */
let dbRef = null, writing = false, pending = false, saveTimer = null, dirty = false;
function setSave(t){ const el = document.getElementById('saveNote'); if (el) el.textContent = t; }
function scheduleSave(){
  dirty = true; try { localStorage.setItem('eleven-gtm-model-v4', JSON.stringify(state)); } catch (e) {}
  if (!dbRef){ setSave('Saved on this device'); return; }
  setSave('Saving…'); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 800);
}
async function flush(){ if (!dbRef) return; if (writing){ pending = true; return; } writing = true;
  try { await dbRef.set(clone(state)); setSave('Saved'); } catch (e) { setSave('Not synced, saved on this device'); }
  writing = false; if (pending){ pending = false; flush(); } }
(async () => {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  try { const db = await window.claude.use('db'); if (!db) return; const ref = db.doc('plan/current');
    const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))]); dbRef = ref;
    if (snap.exists && !dirty){ state = migrate(snap.data()); renderAll(); setSave('Saved'); if (snap.data().version !== 4) flush(); }
    else if (dirty) flush(); else setSave('Saved');
  } catch (e) { setSave('Saved on this device'); }
})();
let dl = null; (async () => { try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) {} })();

}

/* ===== chart ===== */
function chart(series, opts){
  const W = 860, H = opts.h || 280, L = 64, R = 12, T = 14, B = 28; const n = series[0].vals.length;
  const all = series.flatMap(s => s.vals); let lo = Math.min(0, ...all), hi = Math.max(1, ...all); const pad = (hi - lo) * 0.1; hi += pad; if (lo < 0) lo -= pad;
  const bw = (W - L - R)/n, x = i => L + bw*(i + 0.5), y = v => T + (H - T - B)*(1 - (v - lo)/(hi - lo));
  let g = '<g class="grid">';
  for (let k = 0; k <= 4; k++){ const v = lo + (hi - lo)*k/4; g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${opts.fmt(v)}</text>`; }
  g += '</g>';
  for (let i = 0; i < n; i += 6) g += `<text x="${x(i)}" y="${H-9}" text-anchor="middle">${mLabel(i)}</text>`;
  if (lo < 0) g += `<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)"/>`;
  series.filter(s => s.type === 'bar').forEach(s => s.vals.forEach((v, i) => { const y0 = y(0), y1 = y(v);
    g += `<rect x="${x(i) - bw*0.36}" width="${bw*0.72}" y="${Math.min(y0, y1)}" height="${Math.max(1, Math.abs(y1 - y0))}" fill="${v >= 0 ? s.color : s.neg}" opacity=".85"/>`; }));
  series.filter(s => s.type !== 'bar').forEach(s => { g += `<polyline fill="none" stroke="${s.color}" stroke-width="2.4" ${s.dash ? 'stroke-dasharray="6 4"' : ''} points="${s.vals.map((v, i) => x(i) + ',' + y(v)).join(' ')}"/>`; });
  (opts.marks || []).forEach(mk => { if (mk.i < 0 || mk.i >= n) return; const px = x(mk.i);
    g += `<line x1="${px}" x2="${px}" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
    const rows = [mk.title].concat(mk.lines); const w = 132, h = rows.length*15 + 8; let bx = px + 6; if (bx + w > W - R) bx = px - 6 - w;
    g += `<rect x="${bx}" y="${T+2}" width="${w}" height="${h}" rx="3" fill="var(--surface)" stroke="var(--line)"/>`;
    rows.forEach((t, k) => { g += `<text x="${bx+7}" y="${T+16+k*15}" style="${k === 0 ? 'font-weight:700;fill:var(--ink)' : ''}">${esc(t)}</text>`; }); });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label)}">${g}</svg>
  <div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}
const marks = R => [11, 23, 35, 47].filter(i => i < R.H).map(i => ({i, title:mLong(i), lines:['ARR ' + money(R.arr[i]), 'Families ' + R.fam[i].toFixed(0), 'Cash ' + money(R.cash[i])]}));

function getPath(p){ return p.split('.').reduce((o, k) => o == null ? o : o[k], state); }
function setPath(p, val){ const ks = p.split('.'); let o = state; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = val; }
const slider = (p, label, min, max, step, fmt, hint) => `<div class="ctl"><div class="row"><label for="c-${p}">${label}</label><output data-for="${p}" data-fmt="${fmt}"></output></div>
  <input type="range" id="c-${p}" data-k="${p}" data-num min="${min}" max="${max}" step="${step}" value="${esc(getPath(p))}">${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
const amt = (p, aria, extra = '') => { const v = getPath(p); return `<input type="text" inputmode="numeric" data-k="${p}" data-amt aria-label="${esc(aria)}" value="${blank(v) ? '' : full(num(v))}" ${extra}>`; };
const inp = (p, val, type = 'number', extra = '') => `<input type="${type}" data-k="${p}" value="${esc(val)}" ${type === 'number' ? 'data-num inputmode="decimal"' : ''} ${extra}>`;
const sel = (p, val, opts, extra = '') => `<select data-k="${p}" ${extra}>${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
const monthOpts = (from = 1) => Array.from({length: state.horizon - from + 1}, (_, k) => [from + k, mName(from + k - 1)]);
const field = (p, label, hint, w = '120px') => `<div class="ctl"><div class="row"><label>${label}</label><span style="width:${w}">${inp(p, getPath(p), 'number', 'step="any" min="0" aria-label="' + esc(label) + '"')}</span></div>${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;

/* ===== monthly table, CSV, tracking, price book ===== */
function planRows(R){ return [['New families signed', R.sign, 'n'], ['Families live', R.fam, 'n'], ['ARR, end of month', R.arr, 'end'], ['New ARR', R.newArr], ['Collections', R.coll], ['Of which implementation', R.impl], ['Revenue recognized', R.rev],
  ...FNS.map(f => [f, R.byFn[f]]), ['R&D', R.rd], ['COGS', R.cogs], ['G&A', R.ga], ['Total cost', R.spend, 'tot'], ['Net cash flow', R.net], ['Raise', R.raise], ['Cash balance', R.cash, 'tot']]; }
const STOCK = new Set(['Families live', 'ARR, end of month', 'Cash balance']);
OUT.qTable = R => { const Q = []; for (let q = 0; q*3 < R.H; q++){ const f = q*3, t = Math.min(R.H, f + 3) - 1; const [y, m] = ymOf(f); Q.push({f, t, label:'Q' + (Math.floor(m/3) + 1) + ' ' + String(y).slice(2), yEnd: Math.floor(m/3) === 3}); }
  const rows = planRows(R).map(([n, v, t]) => [n === 'ARR, end of month' ? 'ARR, end of quarter' : n, v, t, STOCK.has(n)]);
  return `<table><thead><tr><th>Line</th>${Q.map(q => `<th class="num"${q.yEnd ? ' style="border-right:2px solid var(--line)"' : ''}>${q.label}</th>`).join('')}</tr></thead><tbody>
  ${rows.map(([n, v, t, stock]) => `<tr class="${t === 'tot' ? 'tot' : ''}"><td>${n}</td>${Q.map(q => { const x = stock ? v[q.t] : sum(v, q.f, q.t);
    return `<td class="num ${t !== 'n' && x < -0.5 ? 'gap' : ''}"${q.yEnd ? ' style="border-right:2px solid var(--line)"' : ''}>${t === 'n' ? x.toFixed(stock ? 0 : 1) : money(x)}</td>`; }).join('')}</tr>`).join('')}</tbody></table>`; };
OUT.planTable = R => `<table><thead><tr><th>Line</th>${R.spend.map((_, i) => `<th class="num">M${i+1}<br>${mLabel(i)}</th>`).join('')}</tr></thead><tbody>
  ${planRows(R).map(([n, v, t]) => `<tr class="${t === 'tot' ? 'tot' : ''}"><td>${n}</td>${v.map(x => `<td class="num ${t !== 'n' && x < -0.5 ? 'gap' : ''}">${t === 'n' ? x.toFixed(1) : money(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
function csv(){ const R = run(); const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const rows = [['Line', ...R.spend.map((_, i) => mISO(i))].map(q).join(',')];
  planRows(R).forEach(([n, v, t]) => rows.push([n, ...v.map(x => t === 'n' ? x.toFixed(2) : Math.round(x))].map(q).join(','))); return rows.join('\n'); }
function trackRows(){ const b = state.baseline; if (!b) return []; const keys = Object.keys(state.actuals).map(Number).filter(k => { const a = state.actuals[k]; return a && (a.nf !== '' || a.arr !== '' || a.cash !== ''); });
  const ti = (() => { const d = new Date(); return (d.getFullYear() - +state.startMonth.slice(0, 4))*12 + (d.getMonth() + 1 - +state.startMonth.slice(5, 7)); })();
  const n = Math.min(b.fam.length, Math.max(3, ti + 2, ...keys.map(k => k + 2))); let cum = b.fam0; const out = [];
  for (let i = 0; i < n; i++){ const a = state.actuals[i] || {}; const has = a.nf !== undefined && a.nf !== ''; if (has) cum += num(a.nf);
    out.push({i, planFam:b.fam[i], nf:a.nf ?? '', actFam: has ? cum : null, planArr:b.arr[i], arr:a.arr ?? '', planCash:b.cash[i], cash:a.cash ?? ''}); } return out; }
OUT.trackTable = () => { const dv = (a, p, f) => a === '' || a === null ? '' : `<span class="${a - p >= 0 ? 'okv' : 'gap'}">${a - p >= 0 ? '+' : ''}${f(a - p)}</span>`;
  return `<table><thead><tr><th>Month</th><th class="num">Families, plan</th><th class="num">New families, actual</th><th class="num">Families, actual</th><th class="num">vs plan</th><th class="num">ARR, plan</th><th class="num">ARR, actual</th><th class="num">vs plan</th><th class="num">Cash, plan</th><th class="num">Cash, actual</th><th class="num">vs plan</th></tr></thead><tbody>
  ${trackRows().map(r => `<tr><td>M${r.i+1}, ${mLabel(r.i)}</td><td class="num">${r.planFam.toFixed(1)}</td>
    <td class="num"><input type="number" step="1" min="0" data-act-in="nf" data-i="${r.i}" value="${esc(r.nf)}" aria-label="New families signed, actual"></td>
    <td class="num">${r.actFam === null ? '' : r.actFam.toFixed(0)}</td><td class="num">${dv(r.actFam, r.planFam, v => v.toFixed(1))}</td>
    <td class="num">${money(r.planArr)}</td><td class="num"><input type="text" inputmode="numeric" data-act-in="arr" data-i="${r.i}" value="${r.arr === '' ? '' : full(num(r.arr))}" aria-label="ARR, actual"></td><td class="num">${dv(r.arr === '' ? '' : num(r.arr), r.planArr, money)}</td>
    <td class="num">${money(r.planCash)}</td><td class="num"><input type="text" inputmode="numeric" data-act-in="cash" data-i="${r.i}" value="${r.cash === '' ? '' : full(num(r.cash))}" aria-label="Cash, actual"></td><td class="num">${dv(r.cash === '' ? '' : num(r.cash), r.planCash, money)}</td></tr>`).join('')}</tbody></table>`; };
OUT.priceTable = () => { const p = state.pf; let list = 0;
  const rows = MODS.map(m => { const v = num(p[m]); if (!v) return `<tr><td>${MOD[m].label}</td><td class="num">0</td><td>Not included</td><td class="num">$0</td></tr>`;
    const t = tierOf(m, v); list += t.price; return `<tr><td>${MOD[m].label}</td><td class="num">${v}</td><td>Tier ${t.tier}</td><td class="num">${full(t.price)}</td></tr>`; }).join('');
  const disc = list*num(p.disc)/100, net = list - disc, impl = list*num(state.inp.implPct)/100, y1 = net*(1 - num(state.inp.credit)/12);
  return `<table><thead><tr><th>Module</th><th class="num">Volume</th><th>Tier</th><th class="num">List, annual</th></tr></thead><tbody>${rows}
  <tr><td><b>List platform fees</b></td><td></td><td></td><td class="num"><b>${full(list)}</b></td></tr><tr><td>Discount (${num(p.disc)}%)</td><td></td><td></td><td class="num">(${full(disc)})</td></tr>
  <tr><td><b>Net ARR</b></td><td></td><td></td><td class="num"><b>${full(net)}</b></td></tr><tr><td>Implementation (${num(state.inp.implPct)}% of list platform fees)</td><td></td><td></td><td class="num">${full(impl)}</td></tr>
  <tr><td>Year one platform fees, less ${num(state.inp.credit)}-month credit</td><td></td><td></td><td class="num">${full(y1)}</td></tr><tr><td><b>Cash in year one</b></td><td></td><td></td><td class="num"><b>${full(y1 + impl)}</b></td></tr></tbody></table>`; };

function refresh(){
  const R = run(); window.__R = R; const H = R.H, last = H - 1;
  const el = id => document.getElementById(id);
  if (el('h-low')){
    el('h-low').textContent = money(R.cash[R.low]);
    el('h-payg').textContent = R.payg < 0 ? 'Not yet positive' : 'Positive ' + mLabel(R.payg);
    el('h-label').textContent = (R.out >= 0 ? `Cash runs out ${mLong(R.out)} at these settings. ` : `Funded through ${mLong(last)}. `) + `Cash bottoms ${mLong(R.low)}` + (R.payg < 0 ? `, and collections don’t cover spend for good within ${H} months.` : `, and collections cover spend for good from ${mLong(R.payg)}.`);
    el('stats').innerHTML = [
      [R.fam[last].toFixed(0), `Families live, ${mLong(last)}`],
      [money(R.arr[last]), `ARR, ${mLong(last)}`],
      [money(R.arr[11]), `ARR, ${mLong(11)}, ${R.fam[11].toFixed(0)} families`],
      [money(sum(R.gtm)), 'GTM cost over 4 years'],
      [money(R.cash[last]), `Cash, ${mLong(last)}`]
    ].map(([v, l]) => `<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
    el('ch-cash').innerHTML = chart([{name:'Cash balance', vals:R.cash, color:'var(--btn)'}, {name:'ARR', vals:R.arr, color:'var(--greenl)', dash:true}], {fmt:money, label:'Cash balance and ARR by month', marks:marks(R)});
    el('ch-flow').innerHTML = chart([{name:'Net cash', vals:R.net, color:'var(--greenl)', neg:'var(--red)', type:'bar'}, {name:'Collections', vals:R.coll, color:'var(--btn)'}, {name:'Spend', vals:R.spend, color:'var(--amber-line)'}], {fmt:money, label:'Monthly collections, spend and net cash', h:240});
  }
  document.querySelectorAll('output[data-for]').forEach(o => { o.textContent = FMT[o.dataset.fmt](getPath(o.dataset.for)); });
  document.querySelectorAll('[data-out]').forEach(e => { const f = OUT[e.dataset.out]; if (f) e.innerHTML = f(R); });
  document.querySelectorAll('#presets button[data-preset]').forEach(b => b.classList.toggle('active', b.dataset.preset === state.preset));
}
function renderAll(){ renderAside(); renderMain(); refresh(); }

/* ===== events ===== */
document.getElementById('presets').innerHTML = Object.entries(PRESETS).map(([k, p]) => `<button data-preset="${k}">${p.label}</button>`).join('');
document.getElementById('presets').addEventListener('click', e => { const b = e.target.closest('button[data-preset]'); if (!b) return; const p = PRESETS[b.dataset.preset];
  state.sc = {blend:p.blend, renew:p.renew, r1:p.r1, r2:p.r2, r3:p.r3}; state.preset = b.dataset.preset; scheduleSave(); renderAll(); });
function onField(e){
  const t = e.target;
  if (t.dataset && t.dataset.actIn){ if (e.type === 'input' && t.type !== 'number') return; const i = t.dataset.i; const a = state.actuals[i] = state.actuals[i] || {nf:'', arr:'', cash:''};
    if (t.dataset.actIn === 'nf') a.nf = t.value; else { const v = parseAmt(t.value); if (v === null) return; a[t.dataset.actIn] = v; }
    scheduleSave(); if (e.type === 'change'){ const el = document.querySelector('[data-out="trackTable"]'); if (el) el.innerHTML = OUT.trackTable(); } return; }
  if (!t.dataset || !t.dataset.k) return;
  if (e.type === 'input' && (t.type === 'checkbox' || t.tagName === 'SELECT' || t.type === 'text')) return;
  let val;
  if (t.type === 'checkbox') val = t.checked;
  else if (t.hasAttribute('data-amt')){ const v = parseAmt(t.value); if (v === null) return; val = v; }
  else if (t.hasAttribute('data-num')) val = t.value === '' && t.dataset.k.startsWith('cur.') ? '' : num(t.value);
  else if (t.tagName === 'SELECT') val = num(t.value);
  else val = t.value;
  setPath(t.dataset.k, val);
  if (t.dataset.k.startsWith('sc.')) state.preset = '';
  if (t.dataset.k === 'inp.m2' && num(state.inp.m3) <= val) state.inp.m3 = Math.min(state.horizon, val + 1);
  scheduleSave();
  if (e.type === 'change' && (t.hasAttribute('data-full') || t.hasAttribute('data-amt') || t.type === 'text')){ renderAll(); return; }
  if (e.type === 'input' && t.type === 'number' && t.closest('main')){ refreshKeepFocus(t); return; }
  refresh();
}
function refreshKeepFocus(t){ /* re-render outputs that do not contain the field being typed in */
  const R = run(); window.__R = R;
  document.querySelectorAll('output[data-for]').forEach(o => { o.textContent = FMT[o.dataset.fmt](getPath(o.dataset.for)); });
  document.querySelectorAll('[data-out]').forEach(e => { if (e.contains(t)) return; const f = OUT[e.dataset.out]; if (f) e.innerHTML = f(R); });
}
document.addEventListener('input', onField); document.addEventListener('change', e => { onField(e); });
document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]'); if (tb){ e.preventDefault(); tab = tb.dataset.tab; try { history.replaceState(null, '', '#' + tab); } catch (err) { location.hash = tab; } renderMain(); refresh(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
  const done = () => { scheduleSave(); renderAll(); };
  if (a === 'rafferty') { state.pf = clone(DEFAULT.pf); done(); }
  else if (a === 'lock'){ const go = () => { const R = run(); state.baseline = {at:new Date().toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}), fam:R.fam.map(v => +v.toFixed(3)), arr:R.arr.map(Math.round), cash:R.cash.map(Math.round), fam0:num(state.inp.fam0)}; done(); };
    if (state.baseline) ask('Replace the locked baseline with the current settings? Actuals you entered stay.', go); else go(); }
  else if (a === 'clearActuals') ask('Clear every actual you entered?', () => { state.actuals = {}; done(); });
  else if (a === 'trackCsv'){ const q = s => '"' + String(s).replace(/"/g, '""') + '"'; const rows = [['Month','Families plan','New families actual','Families actual','ARR plan','ARR actual','Cash plan','Cash actual'].map(q).join(',')];
    trackRows().forEach(r => rows.push([mISO(r.i), r.planFam.toFixed(2), r.nf, r.actFam ?? '', r.planArr, r.arr, r.planCash, r.cash].map(q).join(','))); offerFile('eleven-track-against-plan.csv', rows.join('\n')); }
  else if (a === 'csv') offerFile('eleven-operating-plan.csv', csv());
  else if (a === 'backup') offerFile('eleven-gtm-model-backup.json', JSON.stringify(state, null, 2));
  else if (a === 'restore') document.getElementById('restoreFile').click();
  else if (a === 'reset') ask('Reset every input to the starting values? Download a backup first if you want to keep this version.', () => { state = clone(DEFAULT); done(); });
});
document.getElementById('restoreFile').addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return;
  try { state = migrate(JSON.parse(await f.text())); scheduleSave(); renderAll(); } catch (err) { document.getElementById('copyTitle').textContent = 'That file isn’t a backup from this model'; document.getElementById('copyText').value = 'Choose the JSON file from Download backup.'; document.getElementById('copyDlg').showModal(); }
  e.target.value = ''; });
renderAll();
</script>
</body>
</html>
